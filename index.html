<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sound Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overscroll-behavior: none;
        }

        /* 仮想スクロール風コンテナ用のカスタムスクロールバー */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #94a3b8;
        }

        /* イコライザー用の縦スライダー (Webkit) */
        input[type=range].eq-slider {
            -webkit-appearance: slider-vertical;
            width: 8px;
            height: 120px;
            background: #e2e8f0;
            border-radius: 10px;
            outline: none;
        }
        
        /* 再生バー用の横スライダー */
        input[type=range].progress-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            outline: none;
        }
        input[type=range].progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type=range].progress-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 仮想スクロール相当の軽量化 */
        .virtual-item {
            content-visibility: auto;
            contain-intrinsic-size: 64px;
        }

        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden">
    <!-- ルートコンテナ -->
    <div id="app" class="h-full w-full flex flex-col md:flex-row bg-white relative"></div>

    <script>
        const DEFAULT_IMAGE = "https://placehold.co/400x400/e2e8f0/94a3b8?text=No+Image";
        const UNKNOWN_ARTIST = "不明のアーティスト";

        // IndexedDB Configuration (Dexie)
        const db = new Dexie('SoundManagerDB');
        db.version(1).stores({
            tracks: 'id, title, artistId, addedDate, publishDate', // + fileBlob, thumbnailBlob, tagIds, duration
            playlists: 'id, name', // + trackIds (Array)
            tags: 'id, name, order', // + color
            artists: 'id, name', // + iconBlob
            logs: '++id, trackId, playedAt', // + durationPlayed
            settings: 'id'
        });

        // プレビュー用のURLキャッシュ(メモリリーク防止)
        const blobUrlCache = new Map();
        const getCachedBlobUrl = (blob) => {
            if (!blob) return null;
            if (blobUrlCache.has(blob)) return blobUrlCache.get(blob);
            const url = URL.createObjectURL(blob);
            blobUrlCache.set(blob, url);
            return url;
        };
        const clearBlobCache = () => {
            blobUrlCache.forEach(url => URL.revokeObjectURL(url));
            blobUrlCache.clear();
        };

        const audioEngine = {
            audio: new Audio(),
            context: null,
            source: null,
            filters: [],
            blobUrl: null,
            initContext: function() {
                if (this.context) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.context = new AudioContext();
                this.source = this.context.createMediaElementSource(this.audio);
                
                let prevNode = this.source;
                const freqs = [60, 230, 910, 3600, 14000];
                freqs.forEach(f => {
                    let filter = this.context.createBiquadFilter();
                    filter.type = 'peaking';
                    filter.frequency.value = f;
                    filter.Q.value = 1;
                    filter.gain.value = 0;
                    this.filters.push(filter);
                    prevNode.connect(filter);
                    prevNode = filter;
                });
                prevNode.connect(this.context.destination);
            },
            applyEQ: function(values) {
                if (!this.context) return;
                this.filters.forEach((f, i) => {
                    f.gain.value = values[i] || 0;
                });
            },
            setSrc: function(blob) {
                if (this.blobUrl) URL.revokeObjectURL(this.blobUrl);
                this.blobUrl = URL.createObjectURL(blob);
                this.audio.src = this.blobUrl;
                this.audio.load();
            }
        };

        const state = {
            activeTab: 'player', // player, edit, log, settings
            isMobile: window.innerWidth < 768,
            
            player: {
                activePlaylistId: 'all',
                searchQuery: '',
                sortType: 'manual', // manual, added, title, published
                sortDesc: false,
                isMultiSelectMode: false,
                selectedTracks: new Set(),
                isPlaying: false,
                currentTrackId: null,
                isRandom: false,
                isLoop: false,
                speed: 1.0,
                showMobilePlayerWidget: false,
                queue: [], // 再生順
                queueIndex: -1
            },
            
            edit: {
                activeSubTab: 'tracks',
                searchQuery: '',
                sortType: 'added',
                sortDesc: true,
                gridColumns: 4
            },

            modals: {
                fileAdd: false, fileProcessStatus: '',
                playlistCreate: false, playlistEdit: null,
                trackEdit: null, // trackId
                tagEdit: null, // tagId or 'new'
                artistEdit: null, // artistId or 'new'
            },

            data: { tracks: [], tags: [], artists: [], playlists: [] },
            settings: { eqValues: [0,0,0,0,0] }
        };

        const loadDataFromDB = async () => {
            state.data.tracks = await db.tracks.toArray();
            state.data.tags = await db.tags.orderBy('order').toArray();
            state.data.artists = await db.artists.toArray();
            state.data.playlists = await db.playlists.toArray();
            
            if (!state.data.playlists.find(p => p.id === 'all')) {
                const allPl = { id: 'all', name: 'すべての曲', trackIds: [] };
                await db.playlists.add(allPl);
                state.data.playlists.unshift(allPl);
            }

            const st = await db.settings.get('eq');
            if (st && st.values) {
                state.settings.eqValues = st.values;
                audioEngine.applyEQ(st.values);
            }

            // キュー初期化 (現在選択中のプレイリストで)
            updatePlaybackQueue();
        };

        const getArtist = (artistId) => {
            if (!artistId) return { name: UNKNOWN_ARTIST, iconUrl: DEFAULT_IMAGE };
            const a = state.data.artists.find(a => a.id === artistId);
            return a ? { name: a.name, iconUrl: getCachedBlobUrl(a.iconBlob) || DEFAULT_IMAGE } : { name: UNKNOWN_ARTIST, iconUrl: DEFAULT_IMAGE };
        };

        const getTrack = (trackId) => state.data.tracks.find(t => t.id === trackId);
        
        const formatTime = (seconds) => {
            if (isNaN(seconds) || seconds < 0) return "00:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        };

        const escapeHTML = (str) => {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        };

        const updatePlaybackQueue = () => {
            const pl = state.data.playlists.find(p => p.id === state.player.activePlaylistId);
            if (!pl) return;
            
            let tIds = [...pl.trackIds];
            
            // フィルタ & ソート
            tIds = tIds.filter(id => {
                if(!state.player.searchQuery) return true;
                const t = getTrack(id);
                if(!t) return false;
                const a = getArtist(t.artistId);
                const q = state.player.searchQuery.toLowerCase();
                return t.title.toLowerCase().includes(q) || a.name.toLowerCase().includes(q);
            });

            if (state.player.sortType !== 'manual') {
                tIds.sort((idA, idB) => {
                    const a = getTrack(idA), b = getTrack(idB);
                    if(!a || !b) return 0;
                    let valA, valB;
                    if(state.player.sortType === 'added') { valA = a.addedDate; valB = b.addedDate; }
                    else if(state.player.sortType === 'title') { valA = a.title; valB = b.title; }
                    else if(state.player.sortType === 'published') { valA = a.publishDate; valB = b.publishDate; }
                    
                    if (valA < valB) return state.player.sortDesc ? 1 : -1;
                    if (valA > valB) return state.player.sortDesc ? -1 : 1;
                    return 0;
                });
            }

            if (state.player.isRandom) {
                // シャッフル (Fisher-Yates)
                for (let i = tIds.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [tIds[i], tIds[j]] = [tIds[j], tIds[i]];
                }
            }

            state.player.queue = tIds;
            if (state.player.currentTrackId) {
                state.player.queueIndex = tIds.indexOf(state.player.currentTrackId);
            } else {
                state.player.queueIndex = -1;
            }
        };

        const playTrack = (trackId) => {
            audioEngine.initContext();
            if(audioEngine.context && audioEngine.context.state === 'suspended') {
                audioEngine.context.resume();
            }

            const track = getTrack(trackId);
            if (!track) return;
            
            state.player.currentTrackId = trackId;
            state.player.queueIndex = state.player.queue.indexOf(trackId);
            if (state.player.queueIndex === -1 && state.player.queue.length > 0) {
                // 検索等でリストから外れている場合は一旦再生のみ
                state.player.queueIndex = 0;
            }
            
            audioEngine.setSrc(track.fileBlob);
            audioEngine.audio.playbackRate = state.player.speed;
            audioEngine.audio.loop = state.player.isLoop;
            audioEngine.audio.play().then(() => {
                state.player.isPlaying = true;
                renderApp();
            }).catch(e => console.error("Playback failed", e));
        };

        const togglePlay = () => {
            audioEngine.initContext();
            if(audioEngine.context && audioEngine.context.state === 'suspended') {
                audioEngine.context.resume();
            }

            if (audioEngine.audio.paused) {
                if (!state.player.currentTrackId && state.player.queue.length > 0) {
                    playTrack(state.player.queue[0]);
                } else if (state.player.currentTrackId) {
                    audioEngine.audio.play();
                    state.player.isPlaying = true;
                }
            } else {
                audioEngine.audio.pause();
                state.player.isPlaying = false;
            }
            renderApp();
        };

        const skipNext = () => {
            if (state.player.queue.length === 0) return;
            let nextIdx = state.player.queueIndex + 1;
            if (nextIdx >= state.player.queue.length) {
                if (state.player.isLoop) nextIdx = 0;
                else return; // Stop at end
            }
            playTrack(state.player.queue[nextIdx]);
        };

        const skipPrev = () => {
            if (state.player.queue.length === 0) return;
            if (audioEngine.audio.currentTime > 3) {
                audioEngine.audio.currentTime = 0;
                return;
            }
            let prevIdx = state.player.queueIndex - 1;
            if (prevIdx < 0) {
                if (state.player.isLoop) prevIdx = state.player.queue.length - 1;
                else prevIdx = 0;
            }
            playTrack(state.player.queue[prevIdx]);
        };

        // Audio Events
        audioEngine.audio.addEventListener('timeupdate', () => {
            const current = audioEngine.audio.currentTime;
            const duration = audioEngine.audio.duration || 0;
            const progress = duration > 0 ? (current / duration) * 100 : 0;
            
            // リアルタイム更新（DOM直接操作）
            document.querySelectorAll('.player-time-current').forEach(el => el.textContent = formatTime(current));
            document.querySelectorAll('.player-progress-bar').forEach(el => el.style.width = `${progress}%`);
            document.querySelectorAll('.player-progress-slider').forEach(el => {
                if(document.activeElement !== el) el.value = progress;
            });
        });

        audioEngine.audio.addEventListener('ended', async () => {
            // ログ記録
            if (state.player.currentTrackId) {
                await db.logs.add({
                    trackId: state.player.currentTrackId,
                    playedAt: new Date().toISOString(),
                    durationPlayed: audioEngine.audio.currentTime
                });
            }
            
            if (state.player.isLoop && state.player.queue.length === 1) {
                audioEngine.audio.play();
            } else {
                skipNext();
            }
        });

        window.seekAudio = (val) => {
            const duration = audioEngine.audio.duration;
            if(duration) {
                audioEngine.audio.currentTime = (val / 100) * duration;
            }
        };

        const processFiles = async (files) => {
            state.modals.fileProcessStatus = `ファイル解析中... 0/${files.length}`;
            renderApp();

            let allPl = await db.playlists.get('all');
            let addedCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (!file.type.startsWith('audio/')) continue;
                
                state.modals.fileProcessStatus = `ファイル解析中... ${i+1}/${files.length} (${file.name})`;
                document.getElementById('fileProcessStatusText').innerText = state.modals.fileProcessStatus;

                // Extract Meta
                let title = file.name.replace(/\.[^/.]+$/, "");
                let artistName = "不明のアーティスト";
                let thumbBlob = null;
                let publishDate = "";

                const tag = await new Promise((resolve) => {
                    jsmediatags.read(file, {
                        onSuccess: resolve,
                        onError: () => resolve(null)
                    });
                });

                if (tag && tag.tags) {
                    if (tag.tags.title) title = tag.tags.title;
                    if (tag.tags.artist) artistName = tag.tags.artist;
                    if (tag.tags.year) publishDate = tag.tags.year;
                    if (tag.tags.picture) {
                        const data = tag.tags.picture.data;
                        const format = tag.tags.picture.format;
                        thumbBlob = new Blob([new Uint8Array(data)], { type: format });
                    }
                }

                let artist = state.data.artists.find(a => a.name === artistName);
                if (!artist) {
                    artist = { id: 'a_' + Date.now() + Math.random(), name: artistName, iconBlob: null };
                    await db.artists.add(artist);
                    state.data.artists.push(artist);
                }

                // Get duration via Temp Audio
                const objUrl = URL.createObjectURL(file);
                const tempAudio = new Audio(objUrl);
                const duration = await new Promise(r => {
                    tempAudio.onloadedmetadata = () => r(tempAudio.duration);
                    tempAudio.onerror = () => r(0);
                });
                URL.revokeObjectURL(objUrl);

                const newTrack = {
                    id: 'tr_' + Date.now() + Math.random(),
                    title: title,
                    artistId: artist.id,
                    addedDate: new Date().toISOString().split('T')[0],
                    publishDate: publishDate,
                    fileBlob: file,
                    thumbnailBlob: thumbBlob,
                    tagIds: [],
                    duration: duration
                };

                await db.tracks.add(newTrack);
                allPl.trackIds.push(newTrack.id);
                addedCount++;
            }

            await db.playlists.put(allPl);
            await loadDataFromDB();
            state.modals.fileAdd = false;
            state.modals.fileProcessStatus = '';
            renderApp();
            alert(`${addedCount}件のファイルを追加しました。`);
        };


        const renderApp = () => {
            const root = document.getElementById('app');
            root.innerHTML = `
                ${renderSidebarNav()}
                <main class="flex-1 flex flex-col w-full h-full relative overflow-hidden bg-white">
                    ${renderMainContent()}
                    ${renderGlobalBottomWidget()}
                </main>
                ${renderBottomNav()}
                ${renderModals()}
            `;
            attachEventListeners();
        };

        const tabs = [
            { id: 'player', icon: 'fa-music', label: 'プレイヤー' },
            { id: 'edit', icon: 'fa-edit', label: '情報編集' },
            { id: 'log', icon: 'fa-chart-bar', label: 'ログ' },
            { id: 'settings', icon: 'fa-cog', label: '設定' }
        ];

        const renderSidebarNav = () => `
            <nav class="hidden md:flex flex-col w-20 lg:w-64 h-full border-r border-gray-200 bg-gray-50 flex-shrink-0 z-20">
                <div class="p-4 lg:p-6 mb-4 flex items-center justify-center lg:justify-start gap-3">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold">S</div>
                    <span class="hidden lg:block font-bold text-xl text-gray-800 tracking-tight">SoundMgr</span>
                </div>
                <div class="flex flex-col gap-2 px-3">
                    ${tabs.map(tab => `
                        <button data-action="set-tab" data-tab="${tab.id}" 
                            class="flex items-center gap-4 p-3 rounded-xl transition-all duration-200 
                            ${state.activeTab === tab.id ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-200'}">
                            <i class="fas ${tab.icon} text-lg ${state.activeTab === tab.id ? '' : 'text-gray-400'} lg:w-5 text-center"></i>
                            <span class="hidden lg:block font-medium text-sm">${tab.label}</span>
                        </button>
                    `).join('')}
                </div>
            </nav>
        `;

        const renderBottomNav = () => `
            <nav class="md:hidden flex w-full h-16 border-t border-gray-200 bg-white flex-shrink-0 z-30 justify-around items-center absolute bottom-0 left-0 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                ${tabs.map(tab => `
                    <button data-action="set-tab" data-tab="${tab.id}" class="flex flex-col items-center justify-center w-full h-full space-y-1 ${state.activeTab === tab.id ? 'text-indigo-600' : 'text-gray-400'}">
                        <i class="fas ${tab.icon} text-xl mb-1"></i>
                        <span class="text-[10px] font-semibold">${tab.label}</span>
                    </button>
                `).join('')}
            </nav>
        `;

        const renderMainContent = () => {
            const pbClass = state.isMobile ? "pb-16" : "";
            let content = '';
            switch (state.activeTab) {
                case 'player': content = renderPlayerScreen(); break;
                case 'edit': content = renderEditScreen(); break;
                case 'log': content = renderLogScreen(); break;
                case 'settings': content = renderSettingsScreen(); break;
            }
            return `<div class="flex-1 w-full h-full flex flex-col overflow-hidden ${pbClass}">${content}</div>`;
        };

        const renderPlayerScreen = () => {
            const currentTrack = getTrack(state.player.currentTrackId);
            const artist = currentTrack ? getArtist(currentTrack.artistId) : { name: UNKNOWN_ARTIST, iconUrl: DEFAULT_IMAGE };
            const thumb = currentTrack ? getCachedBlobUrl(currentTrack.thumbnailBlob) || DEFAULT_IMAGE : DEFAULT_IMAGE;
            const title = currentTrack ? currentTrack.title : '未選択';
            const durationStr = currentTrack ? formatTime(currentTrack.duration) : '00:00';

            const fullPlayerWidget = `
                <div class="hidden md:flex flex-col w-80 h-full border-r border-gray-200 bg-gray-50 p-6 flex-shrink-0 overflow-y-auto">
                    <div class="aspect-square w-full rounded-2xl overflow-hidden shadow-lg mb-6 relative group bg-gray-200 flex-shrink-0">
                        <img src="${thumb}" class="w-full h-full object-cover">
                    </div>
                    <div class="text-center mb-6 px-2 flex-shrink-0">
                        <h2 class="text-xl font-bold text-gray-800 line-clamp-2 mb-1">${escapeHTML(title)}</h2>
                        <p class="text-sm text-gray-500 line-clamp-1">${escapeHTML(artist.name)}</p>
                    </div>
                    
                    <div class="w-full mb-8 flex-shrink-0">
                        <div class="flex justify-between text-xs text-gray-400 font-medium mb-2">
                            <span class="player-time-current">00:00</span>
                            <span class="player-time-total">${durationStr}</span>
                        </div>
                        <input type="range" class="progress-slider player-progress-slider" value="0" oninput="seekAudio(this.value)">
                    </div>

                    <div class="flex items-center justify-between w-full px-2 mb-8 flex-shrink-0">
                        <button class="text-xl ${state.player.isRandom ? 'text-indigo-600' : 'text-gray-400'} hover:text-indigo-500 transition-colors" data-action="toggle-random"><i class="fas fa-random"></i></button>
                        <button class="text-2xl text-gray-700 hover:text-indigo-600 transition-colors" data-action="skip-prev"><i class="fas fa-step-backward"></i></button>
                        <button class="w-16 h-16 flex items-center justify-center bg-indigo-600 text-white rounded-full shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all text-2xl" data-action="toggle-play">
                            <i class="fas ${state.player.isPlaying ? 'fa-pause' : 'fa-play'} ml-1"></i>
                        </button>
                        <button class="text-2xl text-gray-700 hover:text-indigo-600 transition-colors" data-action="skip-next"><i class="fas fa-step-forward"></i></button>
                        <button class="text-xl ${state.player.isLoop ? 'text-indigo-600' : 'text-gray-400'} hover:text-indigo-500 transition-colors" data-action="toggle-loop"><i class="fas fa-redo"></i></button>
                    </div>
                    
                    <div class="mt-auto flex justify-center w-full pt-4 border-t border-gray-200">
                        <button data-action="toggle-speed" class="flex items-center gap-2 text-xs font-semibold text-gray-500 hover:text-gray-800 bg-white px-4 py-2 rounded-full border shadow-sm transition-colors">
                            <i class="fas fa-tachometer-alt"></i> 速度: ${state.player.speed.toFixed(1)}x
                        </button>
                    </div>
                </div>
            `;

            updatePlaybackQueue();
            const playlistSection = `
                <div class="flex-1 flex flex-col h-full overflow-hidden bg-white relative">
                    <div class="flex items-center gap-3 p-4 border-b border-gray-100 bg-white z-10">
                        <div class="relative flex-1">
                            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="player-search" value="${escapeHTML(state.player.searchQuery)}" onchange="updateSearch(this.value)" class="w-full pl-10 pr-4 py-2.5 bg-gray-100 border-transparent focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 rounded-xl text-sm transition-all" placeholder="タイトル、アーティスト等で検索...">
                        </div>
                        <button data-action="open-modal" data-modal="playlistCreate" class="w-10 h-10 flex flex-shrink-0 items-center justify-center bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-xl transition-colors" title="リスト作成">
                            <i class="fas fa-list-ul"></i><i class="fas fa-plus text-[10px] absolute ml-4 mt-3"></i>
                        </button>
                        <button data-action="open-modal" data-modal="fileAdd" class="w-10 h-10 flex flex-shrink-0 items-center justify-center bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl transition-colors shadow-sm" title="ファイル追加">
                            <i class="fas fa-file-audio"></i><i class="fas fa-plus text-[10px] absolute ml-4 mt-3"></i>
                        </button>
                    </div>

                    <div class="flex items-center justify-between px-2 pt-2 border-b border-gray-100 bg-gray-50/50 flex-shrink-0">
                        <div class="flex-1 flex overflow-x-auto custom-scrollbar gap-1 pb-2 px-2">
                            ${state.data.playlists.map(pl => `
                                <button data-action="set-playlist" data-id="${pl.id}" class="whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-all ${state.player.activePlaylistId === pl.id ? 'bg-indigo-600 text-white shadow-sm' : 'text-gray-500 hover:bg-gray-200'}">
                                    ${escapeHTML(pl.name)}
                                </button>
                            `).join('')}
                        </div>
                        <div class="pl-2 pr-2 pb-2 border-l border-gray-200 ml-2 flex items-center gap-1">
                            ${state.player.activePlaylistId !== 'all' ? `<button data-action="edit-playlist" class="w-8 h-8 rounded-full text-gray-400 hover:bg-gray-200 hover:text-indigo-600 transition-colors"><i class="fas fa-pen"></i></button>` : ''}
                            <button data-action="toggle-multi" class="w-8 h-8 flex items-center justify-center rounded-full text-gray-500 hover:bg-gray-200 transition-colors ${state.player.isMultiSelectMode ? 'bg-indigo-100 text-indigo-600' : ''}" title="複数選択モード">
                                <i class="fas fa-check-double"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center gap-4 px-4 py-2 border-b border-gray-100 bg-white text-xs text-gray-500 flex-shrink-0">
                        <div class="flex gap-4 items-center">
                            <span class="font-semibold text-gray-400"><i class="fas fa-sort-amount-down-alt mr-1"></i>並べ替え:</span>
                            <button data-action="set-sort" data-val="manual" class="hover:text-indigo-600 ${state.player.sortType === 'manual' ? 'text-indigo-600 font-bold' : ''}">手動</button>
                            <button data-action="set-sort" data-val="added" class="hover:text-indigo-600 ${state.player.sortType === 'added' ? 'text-indigo-600 font-bold' : ''}">追加日</button>
                            <button data-action="set-sort" data-val="title" class="hover:text-indigo-600 ${state.player.sortType === 'title' ? 'text-indigo-600 font-bold' : ''}">タイトル</button>
                            <button data-action="set-sort" data-val="published" class="hover:text-indigo-600 ${state.player.sortType === 'published' ? 'text-indigo-600 font-bold' : ''}">投稿日</button>
                        </div>
                        <button data-action="toggle-sort-desc" class="ml-auto w-6 h-6 flex items-center justify-center rounded bg-gray-100 hover:bg-gray-200" ${state.player.sortType === 'manual' ? 'disabled opacity-50' : ''}>
                            <i class="fas ${state.player.sortDesc ? 'fa-arrow-down' : 'fa-arrow-up'} text-[10px]"></i>
                        </button>
                    </div>
                    
                    ${state.player.isMultiSelectMode ? `
                    <div class="flex items-center gap-2 px-4 py-2 bg-indigo-50/50 border-b border-indigo-100 text-sm">
                        <button data-action="multi-select-all" class="text-indigo-600 font-bold hover:underline">全選択</button>
                        <button data-action="multi-select-none" class="text-gray-500 hover:underline ml-2">解除</button>
                        <span class="ml-auto font-bold text-indigo-800">${state.player.selectedTracks.size}件選択中</span>
                        <button data-action="multi-add-playlist" class="ml-2 w-8 h-8 rounded bg-white border border-indigo-200 text-indigo-600 hover:bg-indigo-100"><i class="fas fa-list-ul"></i></button>
                        <button data-action="multi-delete" class="w-8 h-8 rounded bg-white border border-red-200 text-red-600 hover:bg-red-50"><i class="fas fa-trash"></i></button>
                    </div>
                    ` : ''}

                    <div class="flex-1 overflow-y-auto custom-scrollbar p-2 pb-24 md:pb-4 space-y-1">
                        ${state.player.queue.map((trackId, idx) => renderTrackItem(trackId, idx)).join('')}
                        ${state.player.queue.length === 0 ? '<div class="text-center text-gray-400 mt-10 text-sm">曲がありません</div>' : ''}
                    </div>
                </div>
            `;

            return `<div class="flex w-full h-full flex-row">${fullPlayerWidget}${playlistSection}</div>`;
        };

        const renderTrackItem = (trackId, idx) => {
            const track = getTrack(trackId);
            if(!track) return '';
            const artist = getArtist(track.artistId);
            const isPlaying = track.id === state.player.currentTrackId;
            const isSelected = state.player.selectedTracks.has(track.id);
            const thumb = getCachedBlobUrl(track.thumbnailBlob) || DEFAULT_IMAGE;
            
            const tagDots = track.tagIds.map(tid => {
                const tag = state.data.tags.find(t => t.id === tid);
                return tag ? `<span class="w-2.5 h-2.5 rounded-full shadow-sm" style="background-color: ${tag.color};" title="${tag.name}"></span>` : '';
            }).join('');

            return `
            <div class="virtual-item group flex items-center p-2 rounded-xl border ${isSelected ? 'border-indigo-300 bg-indigo-50' : 'border-transparent hover:border-gray-100 hover:bg-gray-50'} transition-all ${isPlaying ? 'bg-indigo-50/50 border-indigo-100' : ''}">
                ${state.player.isMultiSelectMode ? `
                    <div class="px-2 cursor-pointer" data-action="toggle-select" data-id="${track.id}">
                        <i class="far ${isSelected ? 'fa-check-square text-indigo-600' : 'fa-square text-gray-300'} text-lg"></i>
                    </div>
                ` : `
                    <div class="cursor-pointer text-gray-300 hover:text-gray-500 p-2 opacity-50 group-hover:opacity-100 hidden md:block" data-action="move-up" data-id="${track.id}">
                        <i class="fas fa-arrow-up text-xs block mb-1"></i>
                    </div>
                    <div class="cursor-pointer text-gray-300 hover:text-gray-500 p-2 opacity-50 group-hover:opacity-100 hidden md:block" data-action="move-down" data-id="${track.id}">
                        <i class="fas fa-arrow-down text-xs block"></i>
                    </div>
                `}
                
                <div class="relative w-12 h-12 md:w-10 md:h-10 rounded-lg overflow-hidden flex-shrink-0 ml-1 md:ml-2 shadow-sm border border-gray-100 bg-gray-200">
                    <img src="${thumb}" class="w-full h-full object-cover">
                    ${isPlaying ? `
                    <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center">
                        <i class="fas fa-volume-up text-white text-xs"></i>
                    </div>` : `
                    <button data-action="play-track" data-id="${track.id}" class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-40 transition-all flex items-center justify-center text-white opacity-0 group-hover:opacity-100">
                        <i class="fas fa-play text-xs"></i>
                    </button>
                    `}
                </div>

                <div class="flex-1 min-w-0 ml-3 mr-2">
                    <div class="text-sm font-bold text-gray-800 truncate ${isPlaying ? 'text-indigo-600' : ''}">${escapeHTML(track.title)}</div>
                    <div class="flex items-center gap-2 mt-0.5">
                        <span class="text-xs text-gray-500 truncate max-w-[100px] md:max-w-[150px]">${escapeHTML(artist.name)}</span>
                        <div class="flex gap-1 items-center bg-gray-100 px-1.5 py-0.5 rounded-full">${tagDots}</div>
                    </div>
                </div>

                <div class="text-xs font-medium text-gray-400 w-12 text-right mr-4 hidden md:block">${formatTime(track.duration)}</div>

                <div class="flex items-center gap-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                    <button data-action="add-to-playlist" data-id="${track.id}" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-indigo-600 hover:bg-indigo-50"><i class="fas fa-plus text-sm"></i></button>
                    <button data-action="edit-track" data-id="${track.id}" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-green-600 hover:bg-green-50"><i class="fas fa-pen text-sm"></i></button>
                    <button data-action="delete-track" data-id="${track.id}" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-red-600 hover:bg-red-50"><i class="fas fa-trash text-sm"></i></button>
                </div>
            </div>
            `;
        };

        const renderEditScreen = () => {
            const subTabs = [
                { id: 'tracks', label: '曲一覧' },
                { id: 'tags', label: 'タグ管理' },
                { id: 'artists', label: 'アーティスト' }
            ];
            let content = '';
            if (state.edit.activeSubTab === 'tracks') content = renderEditTracks();
            else if (state.edit.activeSubTab === 'tags') content = renderEditTags();
            else if (state.edit.activeSubTab === 'artists') content = renderEditArtists();

            const paddingBottom = (!state.isMobile) ? "pb-20" : "pb-24"; 

            return `
                <div class="flex-1 flex flex-col h-full bg-gray-50 relative">
                    <div class="flex items-center p-2 bg-white border-b border-gray-200 z-10 shadow-sm px-4 gap-2 flex-shrink-0">
                        ${subTabs.map(t => `
                            <button data-action="set-subtab" data-subtab="${t.id}" class="px-5 py-2 rounded-full text-sm font-semibold transition-all ${state.edit.activeSubTab === t.id ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-500 hover:bg-gray-100'}">
                                ${t.label}
                            </button>
                        `).join('')}
                    </div>
                    <div class="flex-1 overflow-y-auto custom-scrollbar p-4 ${paddingBottom}">
                        ${content}
                    </div>
                </div>
            `;
        };

        const renderEditTracks = () => {
            const cols = state.edit.gridColumns;
            const gridClass = cols === 2 ? 'grid-cols-2' : cols === 3 ? 'grid-cols-3' : cols === 4 ? 'grid-cols-4' : 'grid-cols-6';
            
            let displayTracks = [...state.data.tracks];
            // Sort
            displayTracks.sort((a, b) => {
                let valA, valB;
                if(state.edit.sortType === 'added') { valA = a.addedDate; valB = b.addedDate; }
                else if(state.edit.sortType === 'title') { valA = a.title; valB = b.title; }
                else { valA = a.publishDate; valB = b.publishDate; }
                if (valA < valB) return state.edit.sortDesc ? 1 : -1;
                if (valA > valB) return state.edit.sortDesc ? -1 : 1;
                return 0;
            });
            // Search
            if(state.edit.searchQuery) {
                const q = state.edit.searchQuery.toLowerCase();
                displayTracks = displayTracks.filter(t => t.title.toLowerCase().includes(q));
            }

            return `
                <div class="flex flex-col gap-4">
                    <div class="flex flex-col md:flex-row gap-3 md:items-center justify-between bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex-shrink-0">
                        <div class="relative flex-1 max-w-md">
                            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" value="${escapeHTML(state.edit.searchQuery)}" onchange="state.edit.searchQuery=this.value; renderApp();" class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all" placeholder="曲情報を検索...">
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="flex items-center bg-gray-50 rounded-xl border border-gray-200 p-1">
                                <span class="text-xs font-semibold text-gray-400 px-2">並び順:</span>
                                <select onchange="state.edit.sortType=this.value; renderApp();" class="bg-transparent text-sm font-medium text-gray-700 outline-none cursor-pointer">
                                    <option value="added" ${state.edit.sortType==='added'?'selected':''}>追加日</option>
                                    <option value="title" ${state.edit.sortType==='title'?'selected':''}>タイトル</option>
                                    <option value="published" ${state.edit.sortType==='published'?'selected':''}>投稿日</option>
                                </select>
                            </div>
                            <button data-action="toggle-edit-sort" class="w-9 h-9 rounded-xl bg-gray-50 border border-gray-200 text-gray-600 hover:bg-gray-100 flex items-center justify-center"><i class="fas ${state.edit.sortDesc ? 'fa-arrow-down' : 'fa-arrow-up'} text-sm"></i></button>
                            <div class="h-6 w-px bg-gray-300 mx-1"></div>
                            <button data-action="set-grid" data-val="${state.isMobile?2:4}" class="w-9 h-9 rounded-xl ${cols === (state.isMobile?2:4) ? 'bg-indigo-100 text-indigo-600 border-indigo-200' : 'bg-gray-50 border-gray-200 text-gray-600'} border flex items-center justify-center"><i class="fas fa-th-large"></i></button>
                            <button data-action="set-grid" data-val="${state.isMobile?3:6}" class="w-9 h-9 rounded-xl ${cols === (state.isMobile?3:6) ? 'bg-indigo-100 text-indigo-600 border-indigo-200' : 'bg-gray-50 border-gray-200 text-gray-600'} border flex items-center justify-center"><i class="fas fa-th"></i></button>
                        </div>
                    </div>

                    <div class="grid ${gridClass} gap-4 lg:gap-6">
                        ${displayTracks.map(track => {
                            const artist = getArtist(track.artistId);
                            const thumb = getCachedBlobUrl(track.thumbnailBlob) || DEFAULT_IMAGE;
                            const tagDots = track.tagIds.map(tid => {
                                const tag = state.data.tags.find(t => t.id === tid);
                                return tag ? `<span class="w-3 h-3 rounded-full border border-white shadow-sm" style="background-color: ${tag.color};" title="${tag.name}"></span>` : '';
                            }).join('');
                            return `
                            <div class="virtual-item group cursor-pointer bg-white rounded-2xl p-3 shadow-sm border border-gray-100 hover:shadow-md hover:border-indigo-200 transition-all flex flex-col relative" data-action="edit-track" data-id="${track.id}">
                                <div class="relative aspect-square rounded-xl overflow-hidden mb-3 border border-gray-100 bg-gray-200">
                                    <img loading="lazy" src="${thumb}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                    <div class="absolute top-2 right-2 flex -space-x-1">${tagDots}</div>
                                    <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition-all flex items-center justify-center">
                                        <i class="fas fa-pen text-white text-xl opacity-0 group-hover:opacity-100 drop-shadow-md"></i>
                                    </div>
                                </div>
                                <div class="text-sm font-bold text-gray-800 line-clamp-1 mb-1">${escapeHTML(track.title)}</div>
                                <div class="text-xs font-medium text-gray-500 line-clamp-1 mb-1">${escapeHTML(artist.name)}</div>
                                <div class="text-[10px] text-gray-400 mt-auto"><i class="far fa-calendar-alt mr-1"></i>${track.publishDate || '未設定'}</div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        };

        const renderEditTags = () => `
            <div class="max-w-3xl mx-auto flex flex-col gap-4">
                <div class="flex justify-end mb-2">
                    <button data-action="edit-tag" data-id="new" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-sm transition-colors flex items-center gap-2">
                        <i class="fas fa-plus"></i> 新規タグ作成
                    </button>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    ${state.data.tags.map((tag, i) => {
                        const count = state.data.tracks.filter(t => t.tagIds.includes(tag.id)).length;
                        return `
                        <div class="flex items-center p-4 border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors group">
                            <div class="cursor-pointer text-gray-300 hover:text-gray-500 px-2" data-action="move-tag-up" data-id="${tag.id}"><i class="fas fa-arrow-up"></i></div>
                            <div class="cursor-pointer text-gray-300 hover:text-gray-500 px-2 mr-2" data-action="move-tag-down" data-id="${tag.id}"><i class="fas fa-arrow-down"></i></div>
                            <div class="w-6 h-6 rounded-full shadow-inner mr-4 flex-shrink-0" style="background-color: ${tag.color};"></div>
                            <div class="flex-1 font-bold text-gray-800">${escapeHTML(tag.name)}</div>
                            <div class="text-xs text-gray-400 font-medium px-4 bg-gray-100 rounded-full py-1 mr-4">${count} 曲</div>
                            <div class="flex items-center gap-2">
                                <button data-action="edit-tag" data-id="${tag.id}" class="w-9 h-9 rounded-xl bg-white border border-gray-200 text-gray-500 hover:text-indigo-600 shadow-sm flex items-center justify-center"><i class="fas fa-pen"></i></button>
                                <button data-action="delete-tag" data-id="${tag.id}" class="w-9 h-9 rounded-xl bg-white border border-gray-200 text-gray-500 hover:text-red-600 shadow-sm flex items-center justify-center"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `}).join('')}
                    ${state.data.tags.length === 0 ? '<div class="p-6 text-center text-gray-400 text-sm">タグがありません</div>' : ''}
                </div>
            </div>
        `;

        const renderEditArtists = () => `
            <div class="max-w-4xl mx-auto flex flex-col gap-4">
                <div class="flex justify-end mb-2">
                    <button data-action="edit-artist" data-id="new" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-sm transition-colors flex items-center gap-2">
                        <i class="fas fa-user-plus"></i> アーティスト追加
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${state.data.artists.map((artist) => {
                        const count = state.data.tracks.filter(t => t.artistId === artist.id).length;
                        const thumb = getCachedBlobUrl(artist.iconBlob) || DEFAULT_IMAGE;
                        return `
                        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 hover:shadow-md transition-shadow flex items-center gap-4">
                            <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-gray-100 flex-shrink-0 bg-gray-200">
                                <img loading="lazy" src="${thumb}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="font-bold text-gray-800 line-clamp-1 mb-1">${escapeHTML(artist.name)}</div>
                                <div class="text-xs text-gray-500 bg-gray-100 inline-block px-2 py-0.5 rounded-md font-medium">登録曲: ${count}曲</div>
                            </div>
                            <div class="flex flex-col gap-2">
                                <button data-action="edit-artist" data-id="${artist.id}" class="w-8 h-8 rounded-full bg-gray-50 text-gray-500 hover:text-indigo-600 flex items-center justify-center"><i class="fas fa-pen"></i></button>
                                <button data-action="delete-artist" data-id="${artist.id}" class="w-8 h-8 rounded-full bg-gray-50 text-gray-500 hover:text-red-600 flex items-center justify-center"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `}).join('')}
                </div>
            </div>
        `;

        const renderLogScreen = () => {
            const pbClass = state.isMobile ? "pb-24" : "pb-20";
            // 簡易集計 (実データがなければモック的な表示を避けるか0表示)
            const totalTracks = state.data.tracks.length;
            
            return `
                <div class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 bg-gray-50 ${pbClass}">
                    <div class="max-w-5xl mx-auto space-y-8">
                        <h2 class="text-2xl font-black text-gray-800 mb-6 flex items-center gap-3"><i class="fas fa-chart-pie text-indigo-600"></i> リスニングレポート (簡易)</h2>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center">
                                <div class="text-gray-400 text-sm font-bold mb-1">登録曲数</div>
                                <div class="text-2xl font-black text-indigo-600">${totalTracks}<span class="text-sm font-medium text-gray-500 ml-1">曲</span></div>
                            </div>
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center">
                                <div class="text-gray-400 text-sm font-bold mb-1">プレイリスト数</div>
                                <div class="text-2xl font-black text-teal-600">${state.data.playlists.length}</div>
                            </div>
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center">
                                <div class="text-gray-400 text-sm font-bold mb-1">登録アーティスト</div>
                                <div class="text-2xl font-black text-rose-500">${state.data.artists.length}</div>
                            </div>
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center">
                                <div class="text-gray-400 text-sm font-bold mb-1">登録タグ</div>
                                <div class="text-2xl font-black text-amber-500">${state.data.tags.length}</div>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 text-center text-gray-500">
                            詳細な再生ログ（過去1ヶ月のトップ曲など）は再生データが蓄積されると表示されます。
                        </div>
                    </div>
                </div>
            `;
        };

        const renderSettingsScreen = () => {
            const pbClass = state.isMobile ? "pb-24" : "pb-20";
            const freqs = ['60', '230', '910', '3.6k', '14k'];
            const eqVals = state.settings.eqValues;
            
            return `
                <div class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 bg-gray-50 ${pbClass}">
                    <div class="max-w-4xl mx-auto space-y-8">
                        <h2 class="text-2xl font-black text-gray-800 mb-6 flex items-center gap-3"><i class="fas fa-cog text-gray-600"></i> 設定</h2>

                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                            <div class="flex items-center justify-between mb-6">
                                <div>
                                    <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i class="fas fa-sliders-h text-indigo-500"></i> イコライザー設定</h3>
                                    <p class="text-xs text-gray-500 mt-1">音質を好みに合わせて調整します</p>
                                </div>
                            </div>
                            
                            <div class="mb-6 flex gap-2 overflow-x-auto custom-scrollbar pb-2">
                                <button data-action="set-preset" data-val="0,0,0,0,0" class="whitespace-nowrap px-4 py-1.5 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm font-semibold transition-colors">フラット</button>
                                <button data-action="set-preset" data-val="6,4,0,-2,-2" class="whitespace-nowrap px-4 py-1.5 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm font-semibold transition-colors">バスブースト</button>
                                <button data-action="set-preset" data-val="-2,-1,4,5,2" class="whitespace-nowrap px-4 py-1.5 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm font-semibold transition-colors">ボーカル強調</button>
                            </div>

                            <div class="flex items-end justify-around h-48 bg-gray-50/50 border border-gray-100 rounded-2xl p-4">
                                ${freqs.map((freq, i) => `
                                    <div class="flex flex-col items-center gap-3">
                                        <div class="text-[10px] font-bold text-gray-400">+12</div>
                                        <input type="range" class="eq-slider" min="-12" max="12" step="0.1" value="${eqVals[i]}" data-idx="${i}" onchange="updateEQ(this.dataset.idx, this.value)">
                                        <div class="text-[10px] font-bold text-gray-400">-12</div>
                                        <div class="text-xs font-bold text-gray-600 mt-2">${freq}Hz</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                            <h3 class="text-lg font-bold text-gray-800 mb-6 flex items-center gap-2"><i class="fas fa-database text-rose-500"></i> データ管理</h3>
                            <div class="flex items-center justify-between p-4 border border-gray-100 rounded-2xl bg-gray-50">
                                <div>
                                    <div class="font-bold text-gray-800">全データの削除</div>
                                    <div class="text-xs text-gray-500 mt-1">追加した曲やプレイリスト情報を全て削除します。</div>
                                </div>
                                <button data-action="clear-all-data" class="bg-white border-2 border-rose-100 text-rose-600 hover:bg-rose-50 px-5 py-2.5 rounded-xl font-bold shadow-sm transition-all whitespace-nowrap">
                                    クリア実行
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        const renderGlobalBottomWidget = () => {
            const isVisible = state.isMobile || (state.activeTab !== 'player');
            if (!isVisible) return '';

            const currentTrack = getTrack(state.player.currentTrackId);
            const artist = currentTrack ? getArtist(currentTrack.artistId) : { name: UNKNOWN_ARTIST, iconUrl: DEFAULT_IMAGE };
            const thumb = currentTrack ? getCachedBlobUrl(currentTrack.thumbnailBlob) || DEFAULT_IMAGE : DEFAULT_IMAGE;
            const title = currentTrack ? currentTrack.title : '未選択';

            const positionClass = state.isMobile ? "bottom-16" : "bottom-0";
            const borderClass = state.isMobile ? "border-t border-b-0" : "border-t";

            return `
                <div class="absolute ${positionClass} left-0 w-full h-20 bg-white/95 backdrop-blur-md ${borderClass} border-gray-200 shadow-[0_-4px_20px_rgba(0,0,0,0.03)] z-20 flex items-center px-2 md:px-6 cursor-pointer hover:bg-gray-50 transition-colors" onclick="openMobilePlayerWidget()">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gray-100">
                        <div class="h-full bg-indigo-500 rounded-r-full shadow-[0_0_5px_rgba(99,102,241,0.5)] player-progress-bar" style="width: 0%"></div>
                    </div>
                    <img src="${thumb}" class="w-12 h-12 md:w-14 md:h-14 rounded-lg object-cover shadow-sm border border-gray-100 ml-2 bg-gray-200">
                    <div class="flex-1 min-w-0 mx-3 md:mx-4 flex flex-col justify-center">
                        <div class="text-sm md:text-base font-bold text-gray-800 truncate">${escapeHTML(title)}</div>
                        <div class="text-xs text-gray-500 truncate mt-0.5">${escapeHTML(artist.name)}</div>
                    </div>
                    <div class="flex items-center gap-1 md:gap-4 pr-2" onclick="event.stopPropagation()">
                        <button data-action="skip-prev" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:text-indigo-600 transition-colors"><i class="fas fa-step-backward text-lg"></i></button>
                        <button data-action="toggle-play" class="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center bg-indigo-600 text-white rounded-full shadow-md hover:bg-indigo-700 hover:scale-105 transition-all">
                            <i class="fas ${state.player.isPlaying ? 'fa-pause' : 'fa-play'} ml-0.5 text-xl"></i>
                        </button>
                        <button data-action="skip-next" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:text-indigo-600 transition-colors"><i class="fas fa-step-forward text-lg"></i></button>
                    </div>
                </div>
            `;
        };

        const renderModals = () => {
            let html = '';

            // 1. Mobile Full Player
            if (state.player.showMobilePlayerWidget) {
                const currentTrack = getTrack(state.player.currentTrackId);
                const artist = currentTrack ? getArtist(currentTrack.artistId) : { name: UNKNOWN_ARTIST, iconUrl: DEFAULT_IMAGE };
                const thumb = currentTrack ? getCachedBlobUrl(currentTrack.thumbnailBlob) || DEFAULT_IMAGE : DEFAULT_IMAGE;
                const title = currentTrack ? currentTrack.title : '未選択';
                const durationStr = currentTrack ? formatTime(currentTrack.duration) : '00:00';

                html += `
                <div class="fixed inset-0 bg-white z-50 flex flex-col pt-4 animate-[slideUp_0.3s_ease-out]">
                    <div class="flex items-center justify-between px-6 mb-8">
                        <button class="w-10 h-10 flex items-center justify-center text-gray-600 rounded-full bg-gray-100" onclick="closeMobilePlayerWidget()"><i class="fas fa-chevron-down text-xl"></i></button>
                        <div class="text-xs font-bold text-gray-400 tracking-widest uppercase">Now Playing</div>
                        <div class="w-10 h-10"></div>
                    </div>
                    <div class="px-8 mb-10 w-full max-w-sm mx-auto">
                        <div class="aspect-square w-full rounded-[2rem] overflow-hidden shadow-2xl border border-gray-100 bg-gray-200">
                            <img src="${thumb}" class="w-full h-full object-cover">
                        </div>
                    </div>
                    <div class="px-8 mb-8 text-center">
                        <h2 class="text-2xl font-black text-gray-800 line-clamp-1 mb-2">${escapeHTML(title)}</h2>
                        <p class="text-base font-medium text-indigo-500">${escapeHTML(artist.name)}</p>
                    </div>
                    <div class="px-8 mb-10">
                        <input type="range" class="progress-slider w-full player-progress-slider" value="0" oninput="seekAudio(this.value)">
                        <div class="flex justify-between text-xs text-gray-400 font-bold mt-3 px-1">
                            <span class="player-time-current">00:00</span>
                            <span class="player-time-total">${durationStr}</span>
                        </div>
                    </div>
                    <div class="px-8 flex items-center justify-between mb-auto max-w-sm w-full mx-auto">
                        <button data-action="toggle-random" class="text-2xl ${state.player.isRandom ? 'text-indigo-600' : 'text-gray-300'}"><i class="fas fa-random"></i></button>
                        <button data-action="skip-prev" class="text-4xl text-gray-800"><i class="fas fa-step-backward"></i></button>
                        <button data-action="toggle-play" class="w-20 h-20 flex items-center justify-center bg-indigo-600 text-white rounded-full shadow-xl hover:scale-105 transition-transform">
                            <i class="fas ${state.player.isPlaying ? 'fa-pause' : 'fa-play'} ml-1 text-3xl"></i>
                        </button>
                        <button data-action="skip-next" class="text-4xl text-gray-800"><i class="fas fa-step-forward"></i></button>
                        <button data-action="toggle-loop" class="text-2xl ${state.player.isLoop ? 'text-indigo-600' : 'text-gray-300'}"><i class="fas fa-redo"></i></button>
                    </div>
                </div>
                <style>@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }</style>
                `;
            }

            // 2. File Add Modal
            if (state.modals.fileAdd) {
                html += `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl w-full max-w-2xl flex flex-col shadow-2xl overflow-hidden max-h-[90vh]">
                        <div class="flex items-center justify-between p-5 border-b border-gray-100 bg-gray-50/50">
                            <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i class="fas fa-file-audio text-indigo-500"></i> 音声ファイルを追加</h3>
                            <button class="w-8 h-8 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center hover:bg-gray-300 transition-colors" onclick="closeModal('fileAdd')"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="p-6 overflow-y-auto" id="dropzone" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
                            <div class="border-2 border-dashed border-indigo-200 rounded-2xl p-10 text-center bg-indigo-50/30 flex flex-col items-center justify-center transition-all hover:bg-indigo-50/60 hover:border-indigo-300 group cursor-pointer mb-6" onclick="document.getElementById('fileInput').click()">
                                <div class="w-16 h-16 rounded-full bg-white shadow-sm flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                    <i class="fas fa-cloud-upload-alt text-3xl text-indigo-500"></i>
                                </div>
                                <p class="text-base font-bold text-gray-700 mb-2">ファイルをここにドラッグアンドドロップ</p>
                                <p class="text-xs text-gray-500 mb-6">または</p>
                                <button class="bg-indigo-600 text-white px-6 py-2.5 rounded-full text-sm font-bold shadow-md hover:bg-indigo-700 transition-colors">ファイルを選択</button>
                                <input type="file" id="fileInput" multiple accept="audio/*" class="hidden" onchange="handleFileSelect(event)">
                            </div>
                            <div class="text-center font-bold text-indigo-600" id="fileProcessStatusText">${state.modals.fileProcessStatus}</div>
                        </div>
                    </div>
                </div>
                `;
            }

            // 3. Track Edit Modal
            if (state.modals.trackEdit) {
                const track = getTrack(state.modals.trackEdit);
                if (track) {
                    html += `
                    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl w-full max-w-md flex flex-col shadow-2xl overflow-hidden max-h-[90vh]">
                            <div class="p-5 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                                <h3 class="font-bold text-gray-800">曲情報編集</h3>
                            </div>
                            <div class="p-6 overflow-y-auto flex flex-col gap-4">
                                <div>
                                    <label class="text-xs font-bold text-gray-500 block mb-1">タイトル</label>
                                    <input type="text" id="edit-t-title" value="${escapeHTML(track.title)}" class="w-full p-2 border border-gray-200 rounded-lg">
                                </div>
                                <div>
                                    <label class="text-xs font-bold text-gray-500 block mb-1">アーティスト</label>
                                    <select id="edit-t-artist" class="w-full p-2 border border-gray-200 rounded-lg">
                                        ${state.data.artists.map(a => `<option value="${a.id}" ${a.id===track.artistId?'selected':''}>${escapeHTML(a.name)}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="text-xs font-bold text-gray-500 block mb-1">投稿日</label>
                                    <input type="text" id="edit-t-pub" value="${escapeHTML(track.publishDate)}" class="w-full p-2 border border-gray-200 rounded-lg">
                                </div>
                                <div>
                                    <label class="text-xs font-bold text-gray-500 block mb-1">タグ (複数可)</label>
                                    <select id="edit-t-tags" multiple class="w-full p-2 border border-gray-200 rounded-lg h-24">
                                        ${state.data.tags.map(t => `<option value="${t.id}" ${track.tagIds.includes(t.id)?'selected':''}>${escapeHTML(t.name)}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            <div class="p-5 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
                                <button onclick="closeModal('trackEdit')" class="px-4 py-2 rounded-lg bg-white border border-gray-200 text-gray-600 font-bold">キャンセル</button>
                                <button onclick="saveTrackEdit('${track.id}')" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold">保存</button>
                            </div>
                        </div>
                    </div>`;
                }
            }
            
            // 4. Tag Edit Modal
            if (state.modals.tagEdit) {
                const isNew = state.modals.tagEdit === 'new';
                const tag = isNew ? {name:'', color:'#3b82f6'} : state.data.tags.find(t=>t.id===state.modals.tagEdit);
                if(tag) {
                    html += `
                    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl w-full max-w-sm flex flex-col shadow-2xl overflow-hidden">
                            <div class="p-5 border-b border-gray-100 bg-gray-50/50">
                                <h3 class="font-bold text-gray-800">${isNew ? '新規タグ作成' : 'タグ編集'}</h3>
                            </div>
                            <div class="p-6 flex flex-col gap-4">
                                <div><label class="text-xs font-bold text-gray-500 block mb-1">タグ名</label>
                                <input type="text" id="edit-tag-name" value="${escapeHTML(tag.name)}" class="w-full p-2 border border-gray-200 rounded-lg"></div>
                                <div><label class="text-xs font-bold text-gray-500 block mb-1">色</label>
                                <input type="color" id="edit-tag-color" value="${tag.color}" class="w-full h-10 p-1 border border-gray-200 rounded-lg cursor-pointer"></div>
                            </div>
                            <div class="p-5 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
                                <button onclick="closeModal('tagEdit')" class="px-4 py-2 rounded-lg bg-white border border-gray-200 font-bold">キャンセル</button>
                                <button onclick="saveTagEdit('${isNew ? 'new' : tag.id}')" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold">保存</button>
                            </div>
                        </div>
                    </div>`;
                }
            }

            // 5. Playlist Create Modal
            if (state.modals.playlistCreate) {
                html += `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl w-full max-w-sm flex flex-col shadow-2xl overflow-hidden">
                        <div class="p-5 border-b border-gray-100 bg-gray-50/50">
                            <h3 class="font-bold text-gray-800">再生リスト作成</h3>
                        </div>
                        <div class="p-6">
                            <label class="text-xs font-bold text-gray-500 block mb-1">リスト名</label>
                            <input type="text" id="new-playlist-name" class="w-full p-2 border border-gray-200 rounded-lg">
                        </div>
                        <div class="p-5 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
                            <button onclick="closeModal('playlistCreate')" class="px-4 py-2 rounded-lg bg-white border border-gray-200 font-bold">キャンセル</button>
                            <button onclick="createPlaylist()" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold">作成</button>
                        </div>
                    </div>
                </div>`;
            }

            return html;
        };


        window.openMobilePlayerWidget = () => { if (state.isMobile) { state.player.showMobilePlayerWidget = true; renderApp(); } };
        window.closeMobilePlayerWidget = () => { state.player.showMobilePlayerWidget = false; renderApp(); };
        window.closeModal = (m) => { state.modals[m] = false; renderApp(); };
        
        window.handleDrop = (e) => {
            e.preventDefault();
            if(e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                processFiles(e.dataTransfer.files);
            }
        };
        window.handleFileSelect = (e) => {
            if(e.target.files && e.target.files.length > 0) {
                processFiles(e.target.files);
            }
        };
        window.updateSearch = (val) => {
            state.player.searchQuery = val;
            renderApp();
        };
        window.updateEQ = async (idx, val) => {
            state.settings.eqValues[idx] = parseFloat(val);
            audioEngine.applyEQ(state.settings.eqValues);
            await db.settings.put({id: 'eq', values: state.settings.eqValues});
        };

        // Form Saves
        window.saveTrackEdit = async (id) => {
            const track = await db.tracks.get(id);
            if(track) {
                track.title = document.getElementById('edit-t-title').value;
                track.artistId = document.getElementById('edit-t-artist').value;
                track.publishDate = document.getElementById('edit-t-pub').value;
                const opts = document.getElementById('edit-t-tags').options;
                track.tagIds = Array.from(opts).filter(o=>o.selected).map(o=>o.value);
                await db.tracks.put(track);
                await loadDataFromDB();
            }
            closeModal('trackEdit');
        };
        window.saveTagEdit = async (id) => {
            const name = document.getElementById('edit-tag-name').value;
            const color = document.getElementById('edit-tag-color').value;
            if(!name) return;
            if(id === 'new') {
                await db.tags.add({ id: 't_' + Date.now(), name, color, order: state.data.tags.length });
            } else {
                const tag = await db.tags.get(id);
                tag.name = name; tag.color = color;
                await db.tags.put(tag);
            }
            await loadDataFromDB();
            closeModal('tagEdit');
        };
        window.createPlaylist = async () => {
            const name = document.getElementById('new-playlist-name').value;
            if(!name) return;
            const newPl = { id: 'p_' + Date.now(), name, trackIds: [] };
            await db.playlists.add(newPl);
            await loadDataFromDB();
            state.player.activePlaylistId = newPl.id;
            closeModal('playlistCreate');
        };

        const attachEventListeners = () => {
            const app = document.getElementById('app');
            app.onclick = async (e) => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const action = btn.getAttribute('data-action');
                const id = btn.getAttribute('data-id');
                const val = btn.getAttribute('data-val');
                
                if (action === 'set-tab') { state.activeTab = btn.getAttribute('data-tab'); renderApp(); } 
                else if (action === 'set-subtab') { state.edit.activeSubTab = btn.getAttribute('data-subtab'); renderApp(); }
                else if (action === 'toggle-play') togglePlay();
                else if (action === 'skip-next') skipNext();
                else if (action === 'skip-prev') skipPrev();
                else if (action === 'toggle-random') { state.player.isRandom = !state.player.isRandom; renderApp(); }
                else if (action === 'toggle-loop') { state.player.isLoop = !state.player.isLoop; renderApp(); }
                else if (action === 'toggle-speed') { state.player.speed = state.player.speed >= 2.0 ? 0.5 : state.player.speed + 0.5; if(audioEngine.audio) audioEngine.audio.playbackRate = state.player.speed; renderApp(); }
                else if (action === 'open-modal') { state.modals[btn.getAttribute('data-modal')] = true; renderApp(); }
                else if (action === 'play-track') playTrack(id);
                else if (action === 'set-playlist') { state.player.activePlaylistId = id; state.player.selectedTracks.clear(); renderApp(); }
                else if (action === 'set-sort') { state.player.sortType = val; renderApp(); }
                else if (action === 'toggle-sort-desc') { state.player.sortDesc = !state.player.sortDesc; renderApp(); }
                else if (action === 'toggle-multi') { state.player.isMultiSelectMode = !state.player.isMultiSelectMode; state.player.selectedTracks.clear(); renderApp(); }
                else if (action === 'toggle-select') { 
                    if(state.player.selectedTracks.has(id)) state.player.selectedTracks.delete(id); 
                    else state.player.selectedTracks.add(id); 
                    renderApp(); 
                }
                else if (action === 'multi-select-all') { state.player.queue.forEach(tid => state.player.selectedTracks.add(tid)); renderApp(); }
                else if (action === 'multi-select-none') { state.player.selectedTracks.clear(); renderApp(); }
                else if (action === 'multi-delete') {
                    if(!confirm("選択した曲を削除しますか？(すべての曲からは完全に削除されます)")) return;
                    for(let tid of state.player.selectedTracks) {
                        if(state.player.activePlaylistId === 'all') {
                            await db.tracks.delete(tid);
                            // 各プレイリストからも消す
                            let pls = await db.playlists.toArray();
                            for(let p of pls) { p.trackIds = p.trackIds.filter(x=>x!==tid); await db.playlists.put(p); }
                        } else {
                            let pl = await db.playlists.get(state.player.activePlaylistId);
                            pl.trackIds = pl.trackIds.filter(x=>x!==tid);
                            await db.playlists.put(pl);
                        }
                    }
                    state.player.selectedTracks.clear();
                    clearBlobCache();
                    await loadDataFromDB();
                    renderApp();
                }
                else if (action === 'delete-track') {
                    if(!confirm("削除しますか？")) return;
                    if(state.player.activePlaylistId === 'all') {
                        await db.tracks.delete(id);
                        let pls = await db.playlists.toArray();
                        for(let p of pls) { p.trackIds = p.trackIds.filter(x=>x!==id); await db.playlists.put(p); }
                    } else {
                        let pl = await db.playlists.get(state.player.activePlaylistId);
                        pl.trackIds = pl.trackIds.filter(x=>x!==id);
                        await db.playlists.put(pl);
                    }
                    clearBlobCache();
                    await loadDataFromDB();
                    renderApp();
                }
                else if (action === 'edit-track') { state.modals.trackEdit = id; renderApp(); }
                else if (action === 'edit-tag') { state.modals.tagEdit = id; renderApp(); }
                else if (action === 'delete-tag') {
                    await db.tags.delete(id);
                    // 曲からタグ参照を消す
                    let trs = await db.tracks.toArray();
                    for(let t of trs) { if(t.tagIds.includes(id)) { t.tagIds = t.tagIds.filter(x=>x!==id); await db.tracks.put(t); } }
                    await loadDataFromDB(); renderApp();
                }
                else if (action === 'set-grid') { state.edit.gridColumns = parseInt(val); renderApp(); }
                else if (action === 'toggle-edit-sort') { state.edit.sortDesc = !state.edit.sortDesc; renderApp(); }
                else if (action === 'move-up' || action === 'move-down') {
                    if(state.player.sortType !== 'manual') return;
                    let pl = await db.playlists.get(state.player.activePlaylistId);
                    let idx = pl.trackIds.indexOf(id);
                    if(action === 'move-up' && idx > 0) {
                        [pl.trackIds[idx-1], pl.trackIds[idx]] = [pl.trackIds[idx], pl.trackIds[idx-1]];
                    } else if(action === 'move-down' && idx < pl.trackIds.length - 1) {
                        [pl.trackIds[idx+1], pl.trackIds[idx]] = [pl.trackIds[idx], pl.trackIds[idx+1]];
                    }
                    await db.playlists.put(pl);
                    await loadDataFromDB(); renderApp();
                }
                else if (action === 'clear-all-data') {
                    if(!confirm("本当に全てのデータを削除しますか？")) return;
                    clearBlobCache();
                    await db.tracks.clear(); await db.playlists.clear(); await db.tags.clear(); await db.artists.clear(); await db.logs.clear();
                    await loadDataFromDB();
                    renderApp();
                    alert("クリアしました");
                }
                else if (action === 'set-preset') {
                    const vals = val.split(',').map(Number);
                    state.settings.eqValues = vals;
                    audioEngine.applyEQ(vals);
                    await db.settings.put({id: 'eq', values: vals});
                    renderApp();
                }
            };
        };

        window.addEventListener('resize', () => {
            const isMobileNow = window.innerWidth < 768;
            if (state.isMobile !== isMobileNow) {
                state.isMobile = isMobileNow;
                if (!state.isMobile && state.player.showMobilePlayerWidget) state.player.showMobilePlayerWidget = false;
                renderApp();
            }
        });

        // Bootstrap App
        (async () => {
            await loadDataFromDB();
            renderApp();
        })();
    </script>
</body>
</html>
