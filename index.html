<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sound Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overscroll-behavior: none;
        }

        /* カスタムスクロールバー */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #94a3b8;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* スライダー系UI */
        input[type=range].eq-slider {
            -webkit-appearance: slider-vertical;
            width: 8px;
            height: 120px;
            background: #e2e8f0;
            border-radius: 10px;
            outline: none;
        }
        
        input[type=range].progress-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            outline: none;
        }
        input[type=range].progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type=range].progress-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 仮想スクロール相当の軽量化クラス */
        .virtual-item {
            content-visibility: auto;
            contain-intrinsic-size: 64px;
        }

        /* ログ画面用のリッチなスタイル (ライトテーマに合わせたモダンデザイン) */
        .recap-bg {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
        }
        
        .recap-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05);
        }

        /* アニメーション定義 */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-slide-up {
            animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden">
    <!-- ルートコンテナ -->
    <div id="app" class="h-full w-full flex flex-col md:flex-row bg-white relative"></div>

    <script>
        const DEFAULT_IMAGE = "https://placehold.co/400x400/e2e8f0/94a3b8?text=No+Image";
        const UNKNOWN_ARTIST = "Unknown Artist";

        // IndexedDB Configuration (Dexie)
        const db = new Dexie('SoundManagerDB');
        db.version(1).stores({
            tracks: 'id, title, artistId, addedDate, publishDate', // + fileBlob, thumbnailBlob, tagIds, duration
            playlists: 'id, name', // + trackIds (Array)
            tags: 'id, name, order', // + color
            artists: 'id, name', // + iconBlob
            logs: '++id, trackId, playedAt', // + durationPlayed
            settings: 'id'
        });

        // Blob URL Cache
        const blobUrlCache = new Map();
        const getCachedBlobUrl = (blob) => {
            if (!blob) return null;
            if (blobUrlCache.has(blob)) return blobUrlCache.get(blob);
            const url = URL.createObjectURL(blob);
            blobUrlCache.set(blob, url);
            return url;
        };

        const audioEngine = {
            audio: new Audio(),
            context: null,
            source: null,
            filters: [],
            blobUrl: null,
            initContext: function() {
                if (this.context) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.context = new AudioContext();
                    this.source = this.context.createMediaElementSource(this.audio);
                    
                    let prevNode = this.source;
                    const freqs = [60, 230, 910, 3600, 14000];
                    freqs.forEach(f => {
                        let filter = this.context.createBiquadFilter();
                        filter.type = 'peaking';
                        filter.frequency.value = f;
                        filter.Q.value = 1;
                        filter.gain.value = 0;
                        this.filters.push(filter);
                        prevNode.connect(filter);
                        prevNode = filter;
                    });
                    prevNode.connect(this.context.destination);
                } catch (e) {
                    console.warn("AudioContext initialization failed", e);
                }
            },
            applyEQ: function(values) {
                if (!this.context) return;
                this.filters.forEach((f, i) => {
                    f.gain.value = values[i] || 0;
                });
            },
            setSrc: function(blob) {
                if (this.blobUrl) URL.revokeObjectURL(this.blobUrl);
                this.blobUrl = URL.createObjectURL(blob);
                this.audio.src = this.blobUrl;
                this.audio.load();
            }
        };

        const state = {
            activeTab: 'player', 
            isMobile: window.innerWidth < 768,
            
            player: {
                activePlaylistId: 'all',
                searchQuery: '',
                sortType: 'manual', 
                sortDesc: false,
                isMultiSelectMode: false,
                selectedTracks: new Set(),
                isPlaying: false,
                currentTrackId: null,
                isRandom: false,
                isLoop: false,
                speed: 1.0,
                queue: [], 
                queueIndex: -1
            },
            
            edit: {
                activeSubTab: 'tracks',
                searchQuery: '',
                sortType: 'added',
                sortDesc: true,
                gridColumns: window.innerWidth < 768 ? 2 : 4
            },

            modals: {
                fileAdd: false, fileProcessStatus: '',
                playlistCreate: false, playlistEdit: null,
                trackEdit: null, 
                tagEdit: null, 
                artistEdit: null, 
            },

            data: { tracks: [], tags: [], artists: [], playlists: [] },
            logsData: null, // Recap用の集計データ
            settings: { eqValues: [0,0,0,0,0] }
        };

        const loadDataFromDB = async () => {
            state.data.tracks = await db.tracks.toArray();
            state.data.tags = await db.tags.orderBy('order').toArray();
            state.data.artists = await db.artists.toArray();
            state.data.playlists = await db.playlists.toArray();
            
            if (!state.data.playlists.find(p => p.id === 'all')) {
                const allPl = { id: 'all', name: 'すべての曲', trackIds: state.data.tracks.map(t=>t.id) };
                await db.playlists.add(allPl);
                state.data.playlists.unshift(allPl);
            }

            const st = await db.settings.get('eq');
            if (st && st.values) {
                state.settings.eqValues = st.values;
                audioEngine.applyEQ(st.values);
            }

            updatePlaybackQueue();
        };

        const getArtist = (artistId) => {
            if (!artistId) return { name: UNKNOWN_ARTIST, iconUrl: DEFAULT_IMAGE };
            const a = state.data.artists.find(a => a.id === artistId);
            return a ? { name: a.name, iconUrl: getCachedBlobUrl(a.iconBlob) || DEFAULT_IMAGE } : { name: UNKNOWN_ARTIST, iconUrl: DEFAULT_IMAGE };
        };

        const getTrack = (trackId) => state.data.tracks.find(t => t.id === trackId);
        
        const formatTime = (seconds) => {
            if (isNaN(seconds) || !isFinite(seconds) || seconds < 0) return "00:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        };

        const escapeHTML = (str) => {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        };

        const fetchLogData = async () => {
            const allLogs = await db.logs.toArray();
            const trackStats = {};
            let totalDuration = 0;
            
            allLogs.forEach(log => {
                if (!trackStats[log.trackId]) {
                    trackStats[log.trackId] = { count: 0, duration: 0, lastPlayed: log.playedAt };
                }
                trackStats[log.trackId].count++;
                trackStats[log.trackId].duration += (log.durationPlayed || 0);
                if (log.playedAt > trackStats[log.trackId].lastPlayed) {
                    trackStats[log.trackId].lastPlayed = log.playedAt;
                }
                totalDuration += (log.durationPlayed || 0);
            });
            
            // トップトラック算出
            const topTracks = Object.keys(trackStats)
                .map(id => ({ id, ...trackStats[id] }))
                .filter(stat => getTrack(stat.id)) // 削除された曲を除外
                .sort((a, b) => b.count - a.count)
                .slice(0, 10);
                
            // 最近再生した曲
            const recentLogs = allLogs.sort((a, b) => new Date(b.playedAt) - new Date(a.playedAt));
            const recentTrackIds = [...new Set(recentLogs.map(l => l.trackId))]
                .filter(id => getTrack(id))
                .slice(0, 15);

            state.logsData = {
                topTracks,
                recentTrackIds,
                totalPlays: allLogs.length,
                totalDuration
            };
        };

        const updatePlaybackQueue = () => {
            const pl = state.data.playlists.find(p => p.id === state.player.activePlaylistId);
            if (!pl) return;
            
            let tIds = [...pl.trackIds].filter(id => getTrack(id) != null);
            
            if(state.player.searchQuery) {
                tIds = tIds.filter(id => {
                    const t = getTrack(id);
                    const a = getArtist(t.artistId);
                    const q = state.player.searchQuery.toLowerCase();
                    return t.title.toLowerCase().includes(q) || a.name.toLowerCase().includes(q);
                });
            }

            if (state.player.sortType !== 'manual') {
                tIds.sort((idA, idB) => {
                    const a = getTrack(idA), b = getTrack(idB);
                    let valA, valB;
                    if(state.player.sortType === 'added') { valA = a.addedDate; valB = b.addedDate; }
                    else if(state.player.sortType === 'title') { valA = a.title; valB = b.title; }
                    else if(state.player.sortType === 'published') { valA = a.publishDate; valB = b.publishDate; }
                    
                    if (valA < valB) return state.player.sortDesc ? 1 : -1;
                    if (valA > valB) return state.player.sortDesc ? -1 : 1;
                    return 0;
                });
            }

            if (state.player.isRandom) {
                for (let i = tIds.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [tIds[i], tIds[j]] = [tIds[j], tIds[i]];
                }
            }

            state.player.queue = tIds;
            state.player.queueIndex = state.player.currentTrackId ? tIds.indexOf(state.player.currentTrackId) : -1;
        };

        const playTrack = (trackId) => {
            audioEngine.initContext();
            if(audioEngine.context && audioEngine.context.state === 'suspended') {
                audioEngine.context.resume();
            }

            const track = getTrack(trackId);
            if (!track) return;
            
            state.player.currentTrackId = trackId;
            state.player.queueIndex = state.player.queue.indexOf(trackId);
            if (state.player.queueIndex === -1 && state.player.queue.length > 0) {
                state.player.queueIndex = 0;
            }
            
            audioEngine.setSrc(track.fileBlob);
            audioEngine.audio.playbackRate = state.player.speed;
            audioEngine.audio.loop = state.player.isLoop;
            audioEngine.audio.play().then(() => {
                state.player.isPlaying = true;
                renderApp();
            }).catch(e => console.error("Playback failed", e));
        };

        const togglePlay = () => {
            audioEngine.initContext();
            if(audioEngine.context && audioEngine.context.state === 'suspended') audioEngine.context.resume();

            if (audioEngine.audio.paused) {
                if (!state.player.currentTrackId && state.player.queue.length > 0) {
                    playTrack(state.player.queue[0]);
                } else if (state.player.currentTrackId) {
                    audioEngine.audio.play();
                    state.player.isPlaying = true;
                }
            } else {
                audioEngine.audio.pause();
                state.player.isPlaying = false;
            }
            renderApp();
        };

        const skipNext = () => {
            if (state.player.queue.length === 0) return;
            let nextIdx = state.player.queueIndex + 1;
            if (nextIdx >= state.player.queue.length) {
                if (state.player.isLoop) nextIdx = 0;
                else return;
            }
            playTrack(state.player.queue[nextIdx]);
        };

        const skipPrev = () => {
            if (state.player.queue.length === 0) return;
            if (audioEngine.audio.currentTime > 3) {
                audioEngine.audio.currentTime = 0;
                return;
            }
            let prevIdx = state.player.queueIndex - 1;
            if (prevIdx < 0) {
                if (state.player.isLoop) prevIdx = state.player.queue.length - 1;
                else prevIdx = 0;
            }
            playTrack(state.player.queue[prevIdx]);
        };

        audioEngine.audio.addEventListener('timeupdate', () => {
            const current = audioEngine.audio.currentTime;
            const duration = audioEngine.audio.duration || 0;
            const progress = duration > 0 ? (current / duration) * 100 : 0;
            
            document.querySelectorAll('.player-time-current').forEach(el => el.textContent = formatTime(current));
            document.querySelectorAll('.player-progress-bar').forEach(el => el.style.width = `${progress}%`);
            document.querySelectorAll('.player-progress-slider').forEach(el => {
                if(document.activeElement !== el) el.value = progress;
            });
        });

        audioEngine.audio.addEventListener('ended', async () => {
            if (state.player.currentTrackId) {
                await db.logs.add({
                    trackId: state.player.currentTrackId,
                    playedAt: new Date().toISOString(),
                    durationPlayed: audioEngine.audio.currentTime
                });
            }
            if (state.player.isLoop && state.player.queue.length === 1) audioEngine.audio.play();
            else skipNext();
        });

        window.seekAudio = (val) => {
            const duration = audioEngine.audio.duration;
            if(duration) audioEngine.audio.currentTime = (val / 100) * duration;
        };

        const processFiles = async (files) => {
            state.modals.fileProcessStatus = `ファイル解析中... 0/${files.length}`;
            renderApp();

            let allPl = await db.playlists.get('all');
            let addedCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                // 拡張子とMIMEタイプで音声ファイルか判定（MP3対応強化）
                const fname = file.name.toLowerCase();
                const isAudio = file.type.startsWith('audio/') || fname.endsWith('.mp3') || fname.endsWith('.m4a') || fname.endsWith('.wav') || fname.endsWith('.aac') || fname.endsWith('.ogg');
                
                if (!isAudio) {
                    console.warn(`スキップしました (未対応フォーマット): ${file.name}`);
                    continue;
                }
                
                state.modals.fileProcessStatus = `解析中... ${i+1}/${files.length} (${file.name})`;
                const statusEl = document.getElementById('fileProcessStatusText');
                if(statusEl) statusEl.innerText = state.modals.fileProcessStatus;

                let title = file.name.replace(/\.[^/.]+$/, "");
                let artistName = "Unknown Artist";
                let thumbBlob = null;
                let publishDate = "";

                try {
                    const tag = await new Promise((resolve) => {
                        jsmediatags.read(file, {
                            onSuccess: resolve,
                            onError: () => resolve(null)
                        });
                    });

                    if (tag && tag.tags) {
                        if (tag.tags.title) title = tag.tags.title;
                        if (tag.tags.artist) artistName = tag.tags.artist;
                        if (tag.tags.year) publishDate = tag.tags.year;
                        if (tag.tags.picture) {
                            const data = tag.tags.picture.data;
                            const format = tag.tags.picture.format;
                            thumbBlob = new Blob([new Uint8Array(data)], { type: format });
                        }
                    }
                } catch(e) {
                    console.warn("Tag read error", e);
                }

                let artist = state.data.artists.find(a => a.name === artistName);
                if (!artist) {
                    artist = { id: 'a_' + Date.now() + Math.random().toString(36).substr(2, 9), name: artistName, iconBlob: null };
                    await db.artists.add(artist);
                    state.data.artists.push(artist);
                }

                const objUrl = URL.createObjectURL(file);
                const tempAudio = new Audio(objUrl);
                const duration = await new Promise(r => {
                    const timeout = setTimeout(() => r(0), 2000); // タイムアウト設定
                    tempAudio.onloadedmetadata = () => { clearTimeout(timeout); r(tempAudio.duration); };
                    tempAudio.onerror = () => { clearTimeout(timeout); r(0); };
                });
                URL.revokeObjectURL(objUrl);

                const newTrack = {
                    id: 'tr_' + Date.now() + Math.random().toString(36).substr(2, 9),
                    title: title,
                    artistId: artist.id,
                    addedDate: new Date().toISOString().split('T')[0],
                    publishDate: publishDate,
                    fileBlob: file,
                    thumbnailBlob: thumbBlob,
                    tagIds: [],
                    duration: duration
                };

                await db.tracks.add(newTrack);
                if(!allPl.trackIds.includes(newTrack.id)) {
                    allPl.trackIds.push(newTrack.id);
                }
                addedCount++;
            }

            await db.playlists.put(allPl);
            await loadDataFromDB();
            state.modals.fileAdd = false;
            state.modals.fileProcessStatus = '';
            renderApp();
            
            // 処理完了後、簡単な通知（アラートの代わりにカスタムUIを使うことも可能ですが今回はブラウザ標準）
            setTimeout(() => alert(`${addedCount}件のファイルを追加しました。`), 100);
        };

        const switchTab = async (tabId) => {
            if (tabId === 'log') {
                await fetchLogData(); // ログ画面表示前にデータ集計
            }
            state.activeTab = tabId;
            renderApp();
        };

        const renderApp = () => {
            const root = document.getElementById('app');
            root.innerHTML = `
                ${renderSidebarNav()}
                <main class="flex-1 flex flex-col w-full h-full relative overflow-hidden bg-white">
                    ${renderMainContent()}
                    ${renderGlobalBottomWidget()}
                </main>
                ${renderBottomNav()}
                ${renderModals()}
            `;
            attachEventListeners();
        };

        const tabs = [
            { id: 'player', icon: 'fa-music', label: 'プレイヤー' },
            { id: 'edit', icon: 'fa-edit', label: '情報編集' },
            { id: 'log', icon: 'fa-fire', label: 'ハイライト' },
            { id: 'settings', icon: 'fa-cog', label: '設定' }
        ];

        const renderSidebarNav = () => `
            <nav class="hidden md:flex flex-col w-20 lg:w-64 h-full border-r border-gray-200 bg-gray-50 flex-shrink-0 z-20">
                <div class="p-4 lg:p-6 mb-4 flex items-center justify-center lg:justify-start gap-3">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md">
                        <i class="fas fa-play text-xs ml-0.5"></i>
                    </div>
                    <span class="hidden lg:block font-black text-xl text-gray-800 tracking-tight">SoundMgr</span>
                </div>
                <div class="flex flex-col gap-2 px-3">
                    ${tabs.map(tab => `
                        <button data-action="set-tab" data-tab="${tab.id}" 
                            class="flex items-center gap-4 p-3 rounded-xl transition-all duration-200 
                            ${state.activeTab === tab.id ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-200 hover:text-gray-900'}">
                            <i class="fas ${tab.icon} text-lg ${state.activeTab === tab.id ? '' : 'text-gray-400'} lg:w-5 text-center"></i>
                            <span class="hidden lg:block font-bold text-sm tracking-wide">${tab.label}</span>
                        </button>
                    `).join('')}
                </div>
            </nav>
        `;

        const renderBottomNav = () => `
            <nav class="md:hidden flex w-full h-16 border-t border-gray-200 bg-white/90 backdrop-blur-md flex-shrink-0 z-30 justify-around items-center absolute bottom-0 left-0 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
                ${tabs.map(tab => `
                    <button data-action="set-tab" data-tab="${tab.id}" class="flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${state.activeTab === tab.id ? 'text-indigo-600' : 'text-gray-400'}">
                        <i class="fas ${tab.icon} text-xl mb-1 ${state.activeTab === tab.id ? 'drop-shadow-sm' : ''}"></i>
                        <span class="text-[10px] font-bold">${tab.label}</span>
                    </button>
                `).join('')}
            </nav>
        `;

        const renderMainContent = () => {
            const pbClass = state.isMobile ? "pb-24" : ""; // bottom nav & widget padding
            let content = '';
            switch (state.activeTab) {
                case 'player': content = renderPlayerScreen(); break;
                case 'edit': content = renderEditScreen(); break;
                case 'log': content = renderLogScreen(); break;
                case 'settings': content = renderSettingsScreen(); break;
            }
            return `<div class="flex-1 w-full h-full flex flex-col overflow-hidden ${pbClass}">${content}</div>`;
        };

        const renderGlobalBottomWidget = () => {
            // プレイヤー画面以外で表示されるミニプレイヤー
            if (state.activeTab === 'player' || !state.player.currentTrackId) return '';
            const track = getTrack(state.player.currentTrackId);
            if(!track) return '';
            const artist = getArtist(track.artistId);
            const thumb = getCachedBlobUrl(track.thumbnailBlob) || DEFAULT_IMAGE;
            const bottomPos = state.isMobile ? 'bottom-16' : 'bottom-0';

            return `
            <div class="absolute ${bottomPos} left-0 w-full h-16 bg-white/80 backdrop-blur-lg border-t border-gray-200 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] flex items-center px-4 z-20 cursor-pointer transition-all" data-action="set-tab" data-tab="player">
                <div class="w-10 h-10 rounded overflow-hidden flex-shrink-0 shadow-sm mr-3">
                    <img src="${thumb}" class="w-full h-full object-cover">
                </div>
                <div class="flex-1 min-w-0 mr-4">
                    <div class="text-sm font-bold text-gray-800 truncate">${escapeHTML(track.title)}</div>
                    <div class="text-xs text-gray-500 truncate">${escapeHTML(artist.name)}</div>
                </div>
                <div class="flex items-center gap-4 text-gray-700" onclick="event.stopPropagation()">
                    <button data-action="toggle-play" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-200 transition-colors">
                        <i class="fas ${state.player.isPlaying ? 'fa-pause' : 'fa-play'} text-xl"></i>
                    </button>
                    <button data-action="skip-next" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-200 transition-colors hidden sm:flex">
                        <i class="fas fa-step-forward text-lg"></i>
                    </button>
                </div>
                <div class="absolute top-0 left-0 h-0.5 bg-indigo-100 w-full">
                    <div class="h-full bg-indigo-600 player-progress-bar" style="width: 0%"></div>
                </div>
            </div>
            `;
        };

        const renderPlayerScreen = () => {
            const currentTrack = getTrack(state.player.currentTrackId);
            const artist = currentTrack ? getArtist(currentTrack.artistId) : { name: UNKNOWN_ARTIST, iconUrl: DEFAULT_IMAGE };
            const thumb = currentTrack ? getCachedBlobUrl(currentTrack.thumbnailBlob) || DEFAULT_IMAGE : DEFAULT_IMAGE;
            const title = currentTrack ? currentTrack.title : '未選択';
            const durationStr = currentTrack ? formatTime(currentTrack.duration) : '00:00';

            const fullPlayerWidget = `
                <div class="hidden md:flex flex-col w-80 h-full border-r border-gray-200 bg-gray-50 p-6 flex-shrink-0 overflow-y-auto custom-scrollbar">
                    <div class="aspect-square w-full rounded-2xl overflow-hidden shadow-xl mb-6 relative group bg-gray-200 flex-shrink-0">
                        <img src="${thumb}" class="w-full h-full object-cover transition-transform duration-700 ${state.player.isPlaying ? 'scale-105' : 'scale-100'}">
                    </div>
                    <div class="text-center mb-6 px-2 flex-shrink-0">
                        <h2 class="text-xl font-bold text-gray-800 line-clamp-2 mb-1">${escapeHTML(title)}</h2>
                        <p class="text-sm font-medium text-gray-500 line-clamp-1">${escapeHTML(artist.name)}</p>
                    </div>
                    
                    <div class="w-full mb-8 flex-shrink-0">
                        <div class="flex justify-between text-xs text-gray-400 font-bold mb-2">
                            <span class="player-time-current">00:00</span>
                            <span class="player-time-total">${durationStr}</span>
                        </div>
                        <input type="range" class="progress-slider player-progress-slider" value="0" oninput="seekAudio(this.value)">
                    </div>

                    <div class="flex items-center justify-between w-full px-2 mb-8 flex-shrink-0">
                        <button class="text-xl ${state.player.isRandom ? 'text-indigo-600' : 'text-gray-400'} hover:text-indigo-500 transition-colors" data-action="toggle-random"><i class="fas fa-random"></i></button>
                        <button class="text-2xl text-gray-700 hover:text-indigo-600 transition-colors" data-action="skip-prev"><i class="fas fa-step-backward"></i></button>
                        <button class="w-16 h-16 flex items-center justify-center bg-indigo-600 text-white rounded-full shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all text-2xl" data-action="toggle-play">
                            <i class="fas ${state.player.isPlaying ? 'fa-pause' : 'fa-play'} ml-1"></i>
                        </button>
                        <button class="text-2xl text-gray-700 hover:text-indigo-600 transition-colors" data-action="skip-next"><i class="fas fa-step-forward"></i></button>
                        <button class="text-xl ${state.player.isLoop ? 'text-indigo-600' : 'text-gray-400'} hover:text-indigo-500 transition-colors" data-action="toggle-loop"><i class="fas fa-redo"></i></button>
                    </div>
                    
                    <div class="mt-auto flex justify-center w-full pt-4 border-t border-gray-200">
                        <button data-action="toggle-speed" class="flex items-center gap-2 text-xs font-bold text-gray-500 hover:text-gray-800 bg-white px-4 py-2 rounded-full border shadow-sm transition-colors">
                            <i class="fas fa-tachometer-alt text-indigo-500"></i> 速度: ${state.player.speed.toFixed(1)}x
                        </button>
                    </div>
                </div>
            `;

            updatePlaybackQueue();
            const playlistSection = `
                <div class="flex-1 flex flex-col h-full overflow-hidden bg-white relative">
                    <div class="flex items-center gap-3 p-4 border-b border-gray-100 bg-white z-10">
                        <div class="relative flex-1">
                            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="player-search" value="${escapeHTML(state.player.searchQuery)}" onchange="state.player.searchQuery=this.value; renderApp();" class="w-full pl-10 pr-4 py-2.5 bg-gray-100 border-transparent focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 rounded-xl text-sm font-medium transition-all" placeholder="曲名、アーティストを検索...">
                        </div>
                        <button data-action="open-modal" data-modal="fileAdd" class="w-10 h-10 flex flex-shrink-0 items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl transition-all shadow-md" title="ファイル追加">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>

                    <div class="flex items-center justify-between px-2 pt-2 border-b border-gray-100 bg-gray-50/80 flex-shrink-0">
                        <div class="flex-1 flex overflow-x-auto hide-scrollbar gap-2 pb-2 px-2">
                            ${state.data.playlists.map(pl => `
                                <button data-action="set-playlist" data-id="${pl.id}" class="whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-bold transition-all ${state.player.activePlaylistId === pl.id ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-gray-500 border border-gray-200 hover:bg-gray-100'}">
                                    ${escapeHTML(pl.name)}
                                </button>
                            `).join('')}
                        </div>
                        <div class="pl-2 pr-2 pb-2 ml-2 flex items-center gap-2">
                            <button data-action="toggle-multi" class="w-8 h-8 flex items-center justify-center rounded-full transition-colors ${state.player.isMultiSelectMode ? 'bg-indigo-100 text-indigo-600' : 'text-gray-400 hover:bg-gray-200'}" title="複数選択モード">
                                <i class="fas fa-check-double"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto custom-scrollbar p-2 pb-6 space-y-1">
                        ${state.player.queue.map((trackId, idx) => renderTrackItem(trackId, idx)).join('')}
                        ${state.player.queue.length === 0 ? '<div class="flex flex-col items-center justify-center h-full text-gray-400 mt-10"><i class="fas fa-music text-4xl mb-4 opacity-50"></i><p class="font-bold">リストに曲がありません</p></div>' : ''}
                    </div>
                </div>
            `;

            return `<div class="flex w-full h-full flex-row">${fullPlayerWidget}${playlistSection}</div>`;
        };

        const renderTrackItem = (trackId, idx) => {
            const track = getTrack(trackId);
            if(!track) return '';
            const artist = getArtist(track.artistId);
            const isPlaying = track.id === state.player.currentTrackId;
            const isSelected = state.player.selectedTracks.has(track.id);
            const thumb = getCachedBlobUrl(track.thumbnailBlob) || DEFAULT_IMAGE;
            
            return `
            <div class="virtual-item group flex items-center p-2 rounded-xl border ${isSelected ? 'border-indigo-300 bg-indigo-50' : 'border-transparent hover:border-gray-200 hover:bg-gray-50'} transition-all ${isPlaying ? 'bg-indigo-50/50 border-indigo-200 shadow-sm' : ''}">
                ${state.player.isMultiSelectMode ? `
                    <div class="px-2 cursor-pointer" data-action="toggle-select" data-id="${track.id}">
                        <i class="far ${isSelected ? 'fa-check-square text-indigo-600' : 'fa-square text-gray-300'} text-lg"></i>
                    </div>
                ` : ``}
                
                <div class="relative w-12 h-12 md:w-10 md:h-10 rounded-lg overflow-hidden flex-shrink-0 ml-1 md:ml-2 shadow-sm border border-gray-100 bg-gray-200 cursor-pointer" data-action="play-track" data-id="${track.id}">
                    <img src="${thumb}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center transition-opacity ${isPlaying ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}">
                        <i class="fas ${isPlaying ? 'fa-volume-up text-indigo-400' : 'fa-play text-white'} text-xs"></i>
                    </div>
                </div>

                <div class="flex-1 min-w-0 ml-3 mr-2 cursor-pointer" data-action="play-track" data-id="${track.id}">
                    <div class="text-sm font-bold text-gray-800 truncate ${isPlaying ? 'text-indigo-600' : ''}">${escapeHTML(track.title)}</div>
                    <div class="text-xs text-gray-500 truncate mt-0.5">${escapeHTML(artist.name)}</div>
                </div>

                <div class="text-xs font-bold text-gray-400 w-12 text-right mr-4 hidden md:block">${formatTime(track.duration)}</div>
            </div>
            `;
        };

        const renderEditScreen = () => {
            const subTabs = [
                { id: 'tracks', label: '曲リスト' },
                { id: 'tags', label: 'タグ' },
                { id: 'artists', label: 'アーティスト' }
            ];
            let content = '';
            if (state.edit.activeSubTab === 'tracks') content = renderEditTracks();
            else if (state.edit.activeSubTab === 'tags') content = renderEditTags();
            else if (state.edit.activeSubTab === 'artists') content = renderEditArtists();

            return `
                <div class="flex-1 flex flex-col h-full bg-gray-50 relative">
                    <div class="flex items-center p-3 bg-white border-b border-gray-200 z-10 shadow-sm px-4 gap-2 flex-shrink-0">
                        ${subTabs.map(t => `
                            <button data-action="set-subtab" data-subtab="${t.id}" class="px-5 py-2 rounded-full text-sm font-bold transition-all ${state.edit.activeSubTab === t.id ? 'bg-indigo-600 text-white shadow-md' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}">
                                ${t.label}
                            </button>
                        `).join('')}
                    </div>
                    <div class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6">
                        ${content}
                    </div>
                </div>
            `;
        };

        const renderEditTracks = () => {
            // Edit画面の曲一覧は省略せず簡略版で表示
            return `
                <div class="max-w-5xl mx-auto">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-black text-gray-800">全曲管理 (${state.data.tracks.length}曲)</h2>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        ${state.data.tracks.map(track => {
                            const artist = getArtist(track.artistId);
                            const thumb = getCachedBlobUrl(track.thumbnailBlob) || DEFAULT_IMAGE;
                            return `
                            <div class="flex items-center p-3 border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors">
                                <img src="${thumb}" class="w-10 h-10 rounded border border-gray-200 object-cover mr-3">
                                <div class="flex-1 min-w-0">
                                    <div class="font-bold text-sm text-gray-800 truncate">${escapeHTML(track.title)}</div>
                                    <div class="text-xs text-gray-500 truncate">${escapeHTML(artist.name)}</div>
                                </div>
                                <button data-action="delete-track" data-id="${track.id}" class="w-8 h-8 rounded-full text-gray-400 hover:text-red-500 hover:bg-red-50"><i class="fas fa-trash"></i></button>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        };
        const renderEditTags = () => `<div class="p-4 text-center text-gray-500 font-bold">タグ管理機能 (実装略)</div>`;
        const renderEditArtists = () => `<div class="p-4 text-center text-gray-500 font-bold">アーティスト管理機能 (実装略)</div>`;

        const renderLogScreen = () => {
            if (!state.logsData) {
                return `<div class="flex-1 flex items-center justify-center text-indigo-600"><i class="fas fa-circle-notch fa-spin text-4xl"></i></div>`;
            }

            const { topTracks, recentTrackIds, totalPlays, totalDuration } = state.logsData;
            const hasData = totalPlays > 0;

            const formatDurationStr = (sec) => {
                const hours = Math.floor(sec / 3600);
                const mins = Math.floor((sec % 3600) / 60);
                if (hours > 0) return `${hours}時間 ${mins}分`;
                return `${mins}分`;
            };

            return `
                <div class="flex-1 overflow-y-auto hide-scrollbar recap-bg relative font-sans">
                    <!-- 装飾用背景 -->
                    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
                        <div class="absolute -top-20 -left-20 w-[30rem] h-[30rem] bg-indigo-300 rounded-full mix-blend-multiply filter blur-[100px] opacity-20 animate-pulse"></div>
                        <div class="absolute top-1/2 -right-20 w-[30rem] h-[30rem] bg-pink-300 rounded-full mix-blend-multiply filter blur-[100px] opacity-20 animate-pulse delay-200"></div>
                    </div>

                    <div class="max-w-5xl mx-auto p-6 md:p-10 relative z-10 min-h-full flex flex-col pb-32">
                        
                        <header class="mb-12 animate-slide-up text-center md:text-left mt-8">
                            <h1 class="text-5xl md:text-7xl font-black tracking-tighter mb-2 text-gray-800">
                                Your <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-pink-500">Recap</span>
                            </h1>
                            <p class="text-lg text-gray-500 font-medium tracking-wide">リスニング・ハイライト</p>
                        </header>

                        ${!hasData ? `
                            <div class="recap-card rounded-3xl p-10 text-center animate-slide-up delay-100 mt-10">
                                <i class="fas fa-headphones-alt text-6xl text-gray-300 mb-4"></i>
                                <h2 class="text-2xl font-bold text-gray-800 mb-2">まだデータがありません</h2>
                                <p class="text-gray-500">曲を再生して、あなただけのレポートを作成しましょう。</p>
                            </div>
                        ` : `
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                            <div class="recap-card p-8 rounded-3xl flex flex-col justify-center animate-slide-up delay-100 col-span-1 md:col-span-2 relative overflow-hidden group">
                                <div class="absolute inset-0 bg-gradient-to-br from-indigo-50 to-pink-50 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                                <div class="text-sm font-bold text-indigo-500 mb-2 uppercase tracking-widest relative z-10"><i class="fas fa-clock mr-2"></i>Total Listening</div>
                                <div class="text-4xl md:text-6xl font-black text-gray-800 relative z-10">${formatDurationStr(totalDuration)}</div>
                                <div class="text-sm font-medium text-gray-500 mt-2 relative z-10">合計 <span class="font-bold text-gray-700">${totalPlays}</span> 回再生しました</div>
                            </div>
                            <div class="recap-card p-8 rounded-3xl flex flex-col justify-center animate-slide-up delay-200">
                                <div class="text-sm font-bold text-pink-500 mb-2 uppercase tracking-widest"><i class="fas fa-compact-disc mr-2"></i>Collection</div>
                                <div class="text-4xl md:text-5xl font-black text-gray-800">${state.data.tracks.length} <span class="text-xl font-bold text-gray-500">Tracks</span></div>
                                <div class="text-sm font-medium text-gray-500 mt-2">${state.data.artists.length} Artists / ${state.data.playlists.length} Playlists</div>
                            </div>
                        </div>

                        <section class="mb-14 animate-slide-up delay-300">
                            <h2 class="text-2xl font-black text-gray-800 mb-6 flex items-center gap-2"><i class="fas fa-crown text-indigo-500"></i> Most Played Tracks</h2>
                            <div class="flex overflow-x-auto hide-scrollbar gap-6 pb-6 px-2 -mx-2">
                                ${topTracks.map((stat, idx) => {
                                    const track = getTrack(stat.id);
                                    if(!track) return '';
                                    const artist = getArtist(track.artistId);
                                    const thumb = getCachedBlobUrl(track.thumbnailBlob) || DEFAULT_IMAGE;
                                    const sizeClass = idx === 0 ? "w-56 h-56 md:w-64 md:h-64" : "w-40 h-40 md:w-48 md:h-48";
                                    const textClass = idx === 0 ? "text-xl md:text-2xl" : "text-base md:text-lg";
                                    
                                    return `
                                    <div class="flex-shrink-0 flex flex-col items-center group cursor-pointer" data-action="play-track" data-id="${track.id}">
                                        <div class="relative ${sizeClass} rounded-2xl md:rounded-3xl overflow-hidden mb-4 shadow-lg ring-1 ring-gray-900/5 group-hover:-translate-y-2 transition-transform duration-300">
                                            <img src="${thumb}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                                            <div class="absolute top-3 left-3 w-10 h-10 rounded-full bg-white/90 backdrop-blur-md flex items-center justify-center font-black text-indigo-600 shadow-lg z-10">
                                                #${idx + 1}
                                            </div>
                                            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-colors duration-300 flex items-center justify-center">
                                                <i class="fas fa-play text-white text-4xl opacity-0 group-hover:opacity-100 drop-shadow-lg scale-50 group-hover:scale-100 transition-all"></i>
                                            </div>
                                        </div>
                                        <div class="w-full text-center px-1">
                                            <div class="font-black text-gray-800 truncate ${textClass} mb-1 group-hover:text-indigo-600 transition-colors">${escapeHTML(track.title)}</div>
                                            <div class="text-sm font-medium text-gray-500 truncate mb-1.5">${escapeHTML(artist.name)}</div>
                                            <div class="text-xs text-indigo-600 font-bold bg-indigo-50 border border-indigo-100 inline-block px-3 py-1 rounded-full shadow-sm">${stat.count} Plays</div>
                                        </div>
                                    </div>
                                    `;
                                }).join('')}
                            </div>
                        </section>

                        <section class="animate-slide-up delay-400">
                            <h2 class="text-2xl font-black text-gray-800 mb-6 flex items-center gap-2"><i class="fas fa-history text-pink-500"></i> Recently Played</h2>
                            <div class="recap-card rounded-3xl overflow-hidden divide-y divide-gray-100">
                                ${recentTrackIds.map(id => {
                                    const track = getTrack(id);
                                    if(!track) return '';
                                    const artist = getArtist(track.artistId);
                                    const thumb = getCachedBlobUrl(track.thumbnailBlob) || DEFAULT_IMAGE;
                                    return `
                                    <div class="flex items-center p-4 hover:bg-gray-50/80 transition-colors cursor-pointer group" data-action="play-track" data-id="${track.id}">
                                        <div class="w-14 h-14 rounded-xl overflow-hidden mr-4 relative shadow-sm">
                                            <img src="${thumb}" class="w-full h-full object-cover">
                                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                                <i class="fas fa-play text-white text-sm"></i>
                                            </div>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <div class="font-bold text-gray-800 truncate group-hover:text-indigo-600 transition-colors">${escapeHTML(track.title)}</div>
                                            <div class="text-xs font-medium text-gray-500 truncate mt-0.5">${escapeHTML(artist.name)}</div>
                                        </div>
                                    </div>
                                    `;
                                }).join('')}
                            </div>
                        </section>
                        `}
                    </div>
                </div>
            `;
        };

        const renderSettingsScreen = () => {
            return `
                <div class="flex-1 overflow-y-auto custom-scrollbar p-6 bg-gray-50">
                    <div class="max-w-2xl mx-auto space-y-6">
                        <h2 class="text-2xl font-black text-gray-800">設定</h2>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center text-gray-500">
                            イコライザーやストレージ管理などの設定をここに実装します（今回は省略）。
                        </div>
                    </div>
                </div>
            `;
        };

        const renderModals = () => {
            let modals = '';
            
            if (state.modals.fileAdd) {
                modals += `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl p-6 md:p-8 w-full max-w-md shadow-2xl animate-slide-up text-center">
                        <h3 class="text-2xl font-black text-gray-800 mb-2">ファイルを追加</h3>
                        <p class="text-sm text-gray-500 mb-6">MP3, M4A, WAV形式のファイルを選択してください。</p>
                        
                        ${state.modals.fileProcessStatus ? `
                            <div class="py-8">
                                <i class="fas fa-spinner fa-spin text-4xl text-indigo-600 mb-4"></i>
                                <div id="fileProcessStatusText" class="font-bold text-gray-700">${state.modals.fileProcessStatus}</div>
                            </div>
                        ` : `
                            <div class="border-2 border-dashed border-gray-300 rounded-2xl p-8 bg-gray-50 hover:bg-indigo-50 hover:border-indigo-300 transition-colors relative cursor-pointer mb-6 group">
                                <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 group-hover:text-indigo-500 mb-3 transition-colors"></i>
                                <div class="font-bold text-gray-600 group-hover:text-indigo-600 transition-colors">タップしてファイルを選択</div>
                                <!-- 拡張子とMIMEタイプを指定してMP3等を選択可能にする -->
                                <input type="file" multiple accept="audio/*, .mp3, .m4a, .wav, .aac, .ogg" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="processFiles(this.files)">
                            </div>
                            <button data-action="close-modal" data-modal="fileAdd" class="w-full py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200 transition-colors">キャンセル</button>
                        `}
                    </div>
                </div>
                `;
            }
            return modals;
        };

        const attachEventListeners = () => {
            const root = document.getElementById('app');
            root.onclick = (e) => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const action = btn.getAttribute('data-action');
                const id = btn.getAttribute('data-id');
                
                switch (action) {
                    case 'set-tab': switchTab(btn.getAttribute('data-tab')); break;
                    case 'set-subtab': state.edit.activeSubTab = btn.getAttribute('data-subtab'); renderApp(); break;
                    case 'play-track': playTrack(id); break;
                    case 'toggle-play': togglePlay(); break;
                    case 'skip-next': skipNext(); break;
                    case 'skip-prev': skipPrev(); break;
                    case 'toggle-random': state.player.isRandom = !state.player.isRandom; renderApp(); break;
                    case 'toggle-loop': state.player.isLoop = !state.player.isLoop; renderApp(); break;
                    case 'set-playlist': state.player.activePlaylistId = id; renderApp(); break;
                    case 'open-modal': state.modals[btn.getAttribute('data-modal')] = true; renderApp(); break;
                    case 'close-modal': state.modals[btn.getAttribute('data-modal')] = false; renderApp(); break;
                    
                    case 'delete-track':
                        if(confirm('この曲を削除しますか？')) {
                            db.tracks.delete(id).then(async () => {
                                // プレイリストからも削除
                                const allPl = await db.playlists.get('all');
                                allPl.trackIds = allPl.trackIds.filter(tid => tid !== id);
                                await db.playlists.put(allPl);
                                await loadDataFromDB();
                                renderApp();
                            });
                        }
                        break;
                }
            };
        };

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await loadDataFromDB();
            } catch(e) {
                console.error("DB Load Error", e);
            }
            renderApp();
        });

    </script>
</body>
</html>
